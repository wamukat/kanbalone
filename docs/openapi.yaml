    CustomViewSummary:
      type: object
      required: [id, name, version]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        version: { type: integer, minimum: 1 }
    CustomViewDefinition:
      type: object
      required: [name, scope, boardIds, rules, completion, showBody, showLatestComment]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        scope: { type: string, enum: [all, selected] }
        boardIds:
          type: array
          description: Candidate board IDs for selected scope. An empty selection yields zero matches.
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        rules:
          type: array
          description: One rule per configured board. An unconfigured board contributes zero matches, including newly added boards in all scope.
          items:
            type: object
            required: [boardId, mode, tagIds]
            dependentRequired:
              laneMode: [laneIds]
              laneIds: [laneMode]
            properties:
              boardId: { type: integer, minimum: 1 }
              mode: { type: string, enum: [all, tags] }
              tagIds:
                type: array
                description: Match any listed tag belonging to this board. An empty list in tags mode matches nothing. Use an empty list in all mode.
                uniqueItems: true
                items: { type: integer, minimum: 1 }
              laneMode:
                type: string
                enum: [all, selected]
                description: Defaults to all lanes for a new definition or query. A lane condition combines with the tag and completion conditions.
              laneIds:
                type: array
                description: Match any of the selected lane IDs on this board. An empty selection matches nothing. Supply an empty list in all mode.
                uniqueItems: true
                items: { type: integer, minimum: 1 }
        completion: { type: string, enum: [open, done, all] }
        sort:
          type: string
          enum: [position_asc, priority_desc, content_activity_desc]
          description: Applied within each board. A new definition or query defaults to lane and ticket position. The other options use descending priority or the latest known activity from ticket creation, a body edit, a comment post, or a comment edit. Ties use the default order. Deleting a comment preserves the last recorded activity time.
        showBody: { type: boolean }
        showLatestComment: { type: boolean }
