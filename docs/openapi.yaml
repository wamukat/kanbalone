          type: boolean
          description: True if this ticket has a child, including an archived child.
        taskCount:
          type: integer
          minimum: 0
          description: Total Tasks on this ticket.
        doneTaskCount:
          type: integer
          minimum: 0
          description: Completed Tasks on this ticket.
        tags:
          type: array
          description: Tags ordered by name, then ID.
          items:
            type: object
            additionalProperties: false
            required: [id, name, color]
            properties:
              id: { type: integer, minimum: 1 }
              name: { type: string }
              color: { type: string }
    TicketRelationCandidate:
      type: object
      additionalProperties: false
      required: [id, title, parentTicketId, priority, blockerIds, isResolved]
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
        parentTicketId:
          type: [integer, 'null']
          minimum: 1
        priority:
          type: integer
          enum: [1, 2, 3, 4]
        blockerIds:
          type: array
          description: Blocker IDs in ascending order, including blockers on other boards.
          items:
            type: integer
            minimum: 1
        isResolved:
          type: boolean
    TicketUpdate:
      allOf:
      - $ref: '#/components/schemas/TicketUpsert'
      - type: object
        minProperties: 1
        properties:
          appendMarkdown:
            type: string
            minLength: 1
            description: Atomically concatenate this text to the latest body, with no separator added. Mutually exclusive with bodyMarkdown. Result
              is limited to 64 MiB UTF-8. Not idempotent; verify after ambiguous failures before retrying. Does not prevent concurrent full-body replacement.
          childTicketIds:
            type: array
            items: &schemaid001x2
              type: integer
              minimum: 1
            uniqueItems: true
            description: Complete desired child set, not an append. Requires expectedEditToken and expectations for newly selected children.
          expectedEditToken:
            type: string
          expectedSelectedParents:
            type: array
            items:
              type: object
              properties:
                ticketId: *schemaid001x2
                parentTicketId:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
              required:
              - ticketId
              - parentTicketId
          expectedToken:
            type: string
          groupResolution:
            $ref: '#/components/schemas/GroupResolution'
        not:
          properties:
            bodyMarkdown: {}
            appendMarkdown: {}
          required:
          - bodyMarkdown
          - appendMarkdown
    TicketUpsert:
      type: object
      description: Completion is derived from the lane. isResolved and isCompleted are rejected in ticket writes with 400, even when they match the lane.
      not:
        anyOf:
          - properties:
              isResolved: {}
            required: [isResolved]
          - properties:
              isCompleted: {}
            required: [isCompleted]
      properties:
        laneId: { type: integer }
        parentTicketId:
          type: [integer, "null"]
        title: { type: string }
        bodyMarkdown: { type: string }
        isArchived: { type: boolean }
        priority:
          type: integer
          enum: [1, 2, 3, 4]
          description: Ticket priority. 1 = low, 2 = medium, 3 = high, 4 = urgent.
        tagIds:
          type: array
          items:
            type: integer
          description: Existing tag IDs to assign. On update, supplying this array replaces the previous selection. Omission keeps it.
        newTagNames:
          type: array
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: >
            Add these tags in the same transaction as the ticket write. Names are trimmed.
            A same-board exact name is reused first, followed by a case-insensitive match.
            Unmatched names are created without a color. Resolved tags are added to the
            tagIds selection, or to the current selection when tagIds is omitted on update.
            An empty array adds no tags. Ticket previews never create or assign tags.
        blockerIds:
          type: [array, "null"]
          items:
            type: integer
        relatedIds:
          type: [array, "null"]
          items:
            type: integer
    BoardShell:
      type: object
      properties:
        board:
          $ref: "#/components/schemas/Board"
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/Lane"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
      required: [board, lanes, tags]
    BoardDetail:
      allOf:
        - $ref: "#/components/schemas/BoardShell"
        - type: object
          properties:
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/Ticket"
          required: [tickets]
    BoardExport:
      type: object
      properties:
        board:
          $ref: '#/components/schemas/Board'
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/Lane'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        tickets:
          type: array
          items:
            type: object
            properties:
              taskState:
                $ref: '#/components/schemas/TicketTaskExportState'
              resolvedAt:
                type: [string, 'null']
                format: date-time
                description: Completion arrival time, maintained by the server in ordinary ticket APIs. Preserved on import for completed tickets; omitted legacy values are imported as null. Non-null values on unresolved tickets are rejected.
              comments:
                type: array
                items:
                  type: object
                  properties:
                    updater:
                      type: [string, 'null']
                      description: Historical comment creation updater. Older exports omit this field and import as unrecorded.
              groupId:
                type:
                - integer
                - 'null'
                minimum: 1
            required:
            - groupId
        formatVersion:
          type: integer
          enum: [2, 3, 4]
        attachments:
          type: array
          items:
            type: object
            required: [id, mediaType, dataBase64]
            properties:
              id: { type: string, pattern: '^[a-f0-9]{64}$' }
              mediaType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
              dataBase64: { type: string, contentEncoding: base64, maxLength: 13981016 }
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupExport'
      required:
      - board
      - lanes
      - tags
      - tickets
      - formatVersion
      - groups
      allOf:
      - if:
          properties: { formatVersion: { const: 3 } }
        then:
          properties: { attachments: {} }
          required: [attachments]
      - if:
          properties: { formatVersion: { const: 2 } }
        then:
          not:
            properties: { attachments: {} }
            required: [attachments]
      - if:
          properties: { formatVersion: { const: 4 } }
        then:
          properties:
            tickets:
              contains:
                type: object
                properties: { taskState: {} }
                required: [taskState]
        else:
          properties:
            tickets:
              items:
                type: object
                not:
                  properties: { taskState: {} }
                  required: [taskState]
      description: Format 2 carries Groups and tickets. Format 3 also embeds referenced local images. Format 4 preserves Task records and the highest allocated Task numbers and embeds local images when referenced. Import remaps ticket IDs and validates parent/child Group membership. Use a database backup to preserve existing activity history.
