          type: [string, 'null']
          description: Null on the final page.
        total:
          type: integer
          minimum: 0
          description: Count across all pages for these filters.
    ListTicketReference:
      type: object
      additionalProperties: false
      required: [id, title, laneId, parentTicketId, isResolved]
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string }
        laneId: { type: integer, minimum: 1 }
        parentTicketId: { type: [integer, 'null'], minimum: 1 }
        isResolved: { type: boolean }
    GroupTicketRow:
      type: object
      additionalProperties: false
      required: [id, title, laneId, parentTicketId, isResolved, priority, isArchived, hasChildren, taskCount, doneTaskCount, tags]
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string }
        laneId: { type: integer, minimum: 1 }
        parentTicketId: { type: [integer, 'null'], minimum: 1 }
        isResolved: { type: boolean }
        priority: { type: integer, enum: [1, 2, 3, 4] }
        isArchived: { type: boolean }
