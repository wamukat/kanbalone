openapi: 3.1.0
info:
  title: Kanbalone API
  version: 1.6.0
  summary: Ultra-light local personal kanban API for human and AI collaboration
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:3000
security: []
paths:
  /api/custom-views:
    get:
      operationId: listCustomViews
      summary: List named custom views
      responses:
        "200":
          description: Saved view names and versions
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views:
                    type: array
                    items: { $ref: '#/components/schemas/CustomViewSummary' }
    post:
      operationId: createCustomView
      summary: Save a new cross-board view
      description: Newly referenced boards must exist. New tag and lane IDs must belong to their rule's board. An invalid reference returns 400 with code invalid_reference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomViewDefinition' }
      responses:
        "201": { $ref: '#/components/responses/CustomView' }
        "400": { $ref: '#/components/responses/Error' }

  /api/custom-views/{viewId}:
    parameters:
      - name: viewId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getCustomView
      summary: Read a saved view definition and version
      responses:
        "200": { $ref: '#/components/responses/CustomView' }
        "404": { $ref: '#/components/responses/Error' }
    put:
      operationId: replaceCustomView
      summary: Replace a saved view at the expected version
      description: A missing board, tag or lane reference may be retained from the previous version. New references must be valid. Omitted sort retains its previous value. Omitting both lane fields in a rule retains that board's stored lane selection. Use laneMode all with an empty laneIds list to clear the selection. A stale expectedVersion returns 409 with code version_conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CustomViewDefinition'
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: '#/components/responses/CustomView' }
        "400": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCustomView
      summary: Delete a view definition at the expected version
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: View deleted }
        "400": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }

  /api/custom-views/catalog:
    get:
      operationId: getCustomViewCatalog
      summary: List boards and their available tags and lanes for configuration
      responses:
        "200":
          description: Current boards in board order
          content:
            application/json:
              schema:
                type: object
                required: [boards]
                properties:
                  boards:
                    type: array
                    items:
                      type: object
                      required: [id, name, tags, lanes]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        tags:
                          type: array
                          items: { $ref: '#/components/schemas/CustomViewTag' }
                        lanes:
                          type: array
                          description: Lanes in their current order within the board.
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id: { type: integer }
                              name: { type: string }

  /api/custom-views/query:
    post:
      operationId: queryCustomView
      summary: Read one page of matches with exact totals and reference warnings
      description: Accepts an unsaved or saved definition. Pass its nextCursor with the same definition for the next page. A malformed or incompatible cursor returns 400 with code invalid_cursor. A 409 with code stale_cursor requires restarting from the first page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/CustomViewDefinition' }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                cursor: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: A page and counts for the entire result, including boards with zero matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomViewPage' }
        "400": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }

  /api/custom-views/tickets/{ticketId}/text:
    get:
      operationId: getCustomViewTicketText
      summary: Expand a ticket body or one comment to its full original Markdown
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - name: field
          in: query
          required: true
          schema: { type: string, enum: [body, comment] }
        - name: commentId
          in: query
          description: Required for the comment field and omitted for the body field. The comment must belong to this ticket.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Full source text
          content:
            application/json:
              schema:
                type: object
                required: [bodyMarkdown]
                properties:
                  bodyMarkdown: { type: string }
        "400": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }

  /api/custom-views/events:
    get:
      operationId: subscribeCustomViewEvents
      summary: Subscribe to cross-board invalidations via SSE
      description: Requery on changes and reconnects to obtain the current state.
      responses:
        "200":
          description: Invalidation stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"event":"views_updated"}

  /api/attachments:
    post:
      operationId: uploadAttachment
      summary: Store an immutable local image
      description: Accepts one raw raster file up to 10 MiB. The server checks the declared MIME type and container structure without decoding pixels. Identical bytes share one file. Files are retained when edits are cancelled or Markdown references are removed.
      requestBody:
        required: true
        content:
          image/png: {}
          image/jpeg: {}
          image/gif: {}
          image/webp: {}
      responses:
        "201":
          description: Stored image and root-relative URL for use in Markdown
          content:
            application/json:
              schema:
                type: object
                required: [id, mediaType, byteSize, url]
                properties:
                  id: { type: string, pattern: '^[a-f0-9]{64}$' }
                  mediaType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
                  byteSize: { type: integer, minimum: 1, maximum: 10485760 }
                  url: { type: string, pattern: '^/api/attachments/[a-f0-9]{64}$' }
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/attachments/{id}:
    get:
      operationId: getAttachment
      summary: Read the original bytes of an uploaded image
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200":
          description: Verified image file with its original media type and X-Content-Type-Options nosniff
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/meta:
    get:
      summary: Get app metadata
      operationId: getMeta
      responses:
        "200":
          description: App metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  remoteProviders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hasCredential:
                          type: boolean
                      required: [id, hasCredential]
                required: [name, version, remoteProviders]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/remote-diagnostics:
    get:
      summary: List remote provider diagnostic status
      operationId: listRemoteProviderDiagnostics
      responses:
        "200":
          description: Remote provider credential configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hasCredential:
                          type: boolean
                        status:
                          type: string
                          enum: [configured, missing_credential]
                      required: [id, hasCredential, status]
                required: [providers]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Check a remote issue credential
      description: Attempts to resolve a remote issue with an exact-scope configured provider credential and returns a token-safe diagnostic result. Wildcard credentials are not used for user-supplied diagnostic URLs.
      operationId: checkRemoteCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteDiagnosticRequest"
      responses:
        "200":
          description: Remote issue is reachable with the configured credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDiagnosticResult"
        "400":
          description: Diagnostic failed or the provider is unsupported/missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDiagnosticResult"
        "500":
          $ref: "#/components/responses/Error"

  /api/boards:
    get:
      summary: List boards
      operationId: listBoards
      responses:
        "200":
          description: Board list
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
                required: [boards]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Create board
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                laneNames:
                  type: array
                  items:
                    type: string
              required: [name]
      responses:
        "201":
          description: Created board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/Error"

  /api/boards/import:
    post:
      summary: Import a board
      description: Accepts legacy, version 2 and portable version 3 boards up to 64 MiB. Version 3 validates every embedded image digest, media type and rendered local reference before committing the board.
      operationId: importBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardImport"
      responses:
        "201":
          description: Imported board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}:
    get:
      summary: Get board shell
      operationId: getBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Board shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardShell"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename board
      operationId: updateBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete board and related data
      operationId: deleteBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/events:
    get:
      summary: Subscribe to board updates via SSE
      operationId: subscribeBoardEvents
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"boardId":3,"event":"board_updated","sentAt":"2026-04-10T00:00:00.000Z"}
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/lanes:
    get:
      summary: List lanes
      operationId: listLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Lane list
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
                required: [lanes]
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create lane
      operationId: createLane
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                isCompletionLane:
                  type: boolean
                  description: Determines completion for all tickets in this lane, including archived tickets.
              required: [name]
      responses:
        "201":
          description: Created lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/lanes/reorder:
    post:
      summary: Reorder lanes
      operationId: reorderLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                laneIds:
                  type: array
                  items:
                    type: integer
              required: [laneIds]
      responses:
        "200":
          description: Reordered lanes
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
                required: [lanes]
        "400":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/completion-lanes:
    put:
      summary: Atomically replace the completion lane selection
      description: All lane attributes and affected ticket states change together. expectedLanes must contain every current lane, its completion attribute and its total ticket count including archived tickets. Stale expectations return 409 without changes.
      operationId: setCompletionLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [laneIds, expectedLanes]
              properties:
                laneIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                expectedLanes:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, isCompletionLane, ticketCount]
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      isCompletionLane:
                        type: boolean
                      ticketCount:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Updated lanes
          content:
            application/json:
              schema:
                type: object
                required: [lanes]
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/lanes/{laneId}:
    patch:
      summary: Update lane name or completion
      operationId: updateLane
      parameters:
        - $ref: "#/components/parameters/LaneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                isCompletionLane:
                  type: boolean
                  description: Determines completion for all tickets in this lane, including archived tickets.
              minProperties: 1
      responses:
        "200":
          description: Updated lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete empty lane
      operationId: deleteLane
      parameters:
        - $ref: "#/components/parameters/LaneId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The lane still contains tickets. Counts reflect the rejected delete attempt.
          content:
            application/json:
              schema:
                type: object
                required: [error, details]
                properties:
                  error:
                    type: string
                  details:
                    $ref: "#/components/schemas/LaneTicketCounts"

  /api/lanes/{laneId}/ticket-counts:
    get:
      summary: Count tickets in a lane, including archived tickets
      operationId: getLaneTicketCounts
      parameters:
        - $ref: "#/components/parameters/LaneId"
      responses:
        "200":
          description: Current counts across all tickets in the lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneTicketCounts"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tags:
    get:
      summary: List tags
      operationId: listTags
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
                required: [tags]
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create tag
      operationId: createTag
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
              required: [name]
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tags/{tagId}:
    patch:
      summary: Update tag
      operationId: updateTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete tag
      operationId: deleteTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets:
    get:
      summary: List ticket summaries
      description: Lightweight summary endpoint for board rendering, filtering, search, and automation on large boards. Fetch individual ticket
        detail separately when body, comments, or expanded relations are needed. Lane and tag selections are combined with AND. Use resolved for completion filtering. The removed completed query alias returns 400.
      operationId: listTickets
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: lane_id
        in: query
        schema:
          type: integer
      - $ref: '#/components/parameters/TicketLaneIds'
      - name: lane
        in: query
        description: Exact lane name. Cannot be combined with lane_id or lane_ids. Unknown names return an empty list.
        schema:
          type: string
          minLength: 1
      - name: parent
        in: query
        description: Direct parent ticket ID, or none for tickets without a parent. Does not include all descendants.
        schema:
          type: string
          pattern: ^(none|[1-9][0-9]*)$
      - name: tag
        in: query
        description: Exact tag name. Cannot be combined with tag_ids.
        schema:
          type: string
      - $ref: '#/components/parameters/TicketTagIds'
      - name: resolved
        in: query
        schema:
          type: boolean
      - name: archived
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - all
      - name: q
        in: query
        description: Search title, body Markdown, local ticket refs such as
        schema:
          type: string
      - name: groupId
        in: query
        schema:
          type: integer
          minimum: 1
        description: Group on this board; mutually exclusive with ungrouped=true.
      - name: ungrouped
        in: query
        schema:
          type: boolean
        description: Only ungrouped tickets. Cannot be combined with groupId.
      - name: includeArchived
        in: query
        schema:
          type: boolean
        description: Alias for including archived tickets when archived is omitted. Prefer archived=all.
      - name: limit
        in: query
        description: Opt into pagination. Required for the first and every continuation page; may change between requests (for example 5 then 50). Omit limit and cursor to retain full-list responses.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        description: Opaque nextCursor from the previous page. Repeat the same board, filters and order; changed list data returns 409 and requires restarting. Requires limit.
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: include_blocker_references
        in: query
        description: Include the existing blockers of tickets on this page, regardless of filters. When true, requires limit.
        schema:
          type: boolean
          default: false
      - name: order
        in: query
        description: Explicit order. Paged default is id_asc; unpaged default retains legacy lane/archive/position/id order. completed_desc matches completion-lane UI (completion time descending, position ascending, ID descending). Works without pagination too.
        schema:
          type: string
          enum: [id_asc, position_asc, completed_desc]
      - name: priority
        in: query
        description: Comma-separated priority values (OR), applied before pagination. Values 1 to 4; duplicates and order are normalized. Omitted means all priorities.
        schema:
          type: string
          pattern: '^[1-4](,[1-4])*$'
          maxLength: 127
        example: '1,3'
      responses:
        '200':
          description: Ticket summary list
          headers:
            X-Kanbalone-Ticket-Revision:
              description: Present for paged responses. Board ticket-list revision read in the same transaction as this page. Clients combining independent filtered collections can compare revisions and restart when they differ. Not a historical snapshot or a replacement for the opaque cursor.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketSummary'
                  page:
                    type: object
                    description: Present only when limit is specified. total counts all matching tickets, including those not in this page. A null nextCursor means there are no further pages.
                    additionalProperties: false
                    required: [nextCursor, total]
                    properties:
                      nextCursor:
                        type: [string, 'null']
                      total:
                        type: integer
                        minimum: 0
                required:
                - tickets
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Create ticket
      operationId: createTicket
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TicketCreate'
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
      responses:
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
        '409':
          $ref: '#/components/responses/GroupError'
        '428':
          $ref: '#/components/responses/GroupError'

  /api/boards/{boardId}/group-tickets:
    get:
      summary: List Group ticket rows
      description: Returns all members of a Group including archived tickets, in ascending ID order. Omit groupId for ungrouped tickets. Unlisted query parameters return 400.
      operationId: listGroupTickets
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/TicketProjectionPageLimit'
        - $ref: '#/components/parameters/TicketCollectionCursor'
        - name: order
          in: query
          description: May be omitted. The order is fixed.
          schema: { type: string, enum: [id_asc] }
        - name: groupId
          in: query
          description: ID of a Group on this board.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: A page of projected ticket rows
          headers:
            X-Kanbalone-Ticket-Revision:
              description: The board ticket-list revision from the same read transaction as this page.
              schema: { type: integer, minimum: 0 }
            X-Kanbalone-Ticket-Page-Limit:
              description: The supported maximum for subsequent pages of this projection.
              schema: { type: integer, minimum: 1, maximum: 800 }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tickets, page]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupTicketRow'
                  page:
                    $ref: '#/components/schemas/TicketCollectionPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/list-ticket-references:
    get:
      summary: List ticket references for List
      description: Returns priority-independent references in lane, archive, position and ID order. Lane and tag selections are combined with AND. Apply the same List filters as the displayed collection apart from priority. Unlisted query parameters return 400.
      operationId: listTicketReferences
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/TicketProjectionPageLimit'
        - $ref: '#/components/parameters/TicketCollectionCursor'
        - name: order
          in: query
          description: May be omitted. The order is fixed.
          schema: { type: string, enum: [position_asc] }
        - name: lane_id
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/TicketLaneIds'
        - name: resolved
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          description: Excludes archived tickets by default.
          schema: { type: string, enum: ['true', 'false', all] }
        - name: tag
          in: query
          description: Exact tag name. Cannot be combined with tag_ids.
          schema: { type: string }
        - $ref: '#/components/parameters/TicketTagIds'
        - name: q
          in: query
          description: Same text and reference matching as the ticket summaries endpoint.
          schema: { type: string }
      responses:
        '200':
          description: A page of projected ticket rows
          headers:
            X-Kanbalone-Ticket-Revision:
              description: The board ticket-list revision from the same read transaction as this page.
              schema: { type: integer, minimum: 0 }
            X-Kanbalone-Ticket-Page-Limit:
              description: The supported maximum for subsequent pages of this projection.
              schema: { type: integer, minimum: 1, maximum: 800 }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tickets, page]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListTicketReference'
                  page:
                    $ref: '#/components/schemas/TicketCollectionPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/relation-candidates:
    get:
      summary: List relation picker candidates
      description: Returns active and archived tickets on this board in ascending ID order. Each record contains the fields used by the relation pickers. Query parameters other than limit, cursor and order return 400.
      operationId: listTicketRelationCandidates
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - name: limit
          in: query
          required: true
          description: Page size. May change between requests.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          description: Opaque nextCursor from the previous response of this endpoint for the same board. A change in the ticket-list revision returns 409 and requires restarting.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: order
          in: query
          description: The order is fixed at id_asc, which may be supplied explicitly.
          schema:
            type: string
            enum: [id_asc]
      responses:
        '200':
          description: A page of relation candidates
          headers:
            X-Kanbalone-Ticket-Revision:
              description: Board ticket-list revision from the same read transaction as this page.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tickets, page]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketRelationCandidate'
                  page:
                    type: object
                    additionalProperties: false
                    required: [nextCursor, total]
                    properties:
                      nextCursor:
                        type: [string, 'null']
                        description: Null on the final page.
                      total:
                        type: integer
                        minimum: 0
                        description: Total number of active and archived tickets on the board.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/remote-import:
    post:
      summary: Import a remote issue into a board
      description: Creates one local ticket from a remote issue snapshot. The created ticket uses the remote title and copies the remote body into the local body for initial implementation context. Remote metadata is tracked on the ticket, but board export omits it.
      operationId: importRemoteIssue
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RemoteIssueImport"
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
      responses:
        "201":
          description: Imported tracked ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/remote-import/preview:
    post:
      summary: Preview a remote issue before import
      description: Resolves a remote issue without creating a local ticket and reports whether the remote issue has already been imported.
      operationId: previewRemoteIssueImport
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteIssueImport"
      responses:
        "200":
          description: Remote issue preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteIssueImportPreview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets/bulk-transition:
    post:
      summary: Bulk transition tickets by lane name
      operationId: bulkTransitionTickets
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Resolve or reopen by destination lane. Completion flags are rejected with 400.
              not:
                anyOf:
                  - properties:
                      isResolved: {}
                    required: [isResolved]
                  - properties:
                      isCompleted: {}
                    required: [isCompleted]
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                ticketIds:
                  type: array
                  items:
                    type: integer
                laneName:
                  type: string
              required: [ticketIds, laneName]
      responses:
        "200":
          description: Updated ticket summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
                required: [tickets]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets/bulk-archive:
    post:
      summary: Archive or restore selected tickets
      operationId: bulkArchiveTickets
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, isArchived]
              properties:
                ticketIds:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                isArchived:
                  type: boolean
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
      responses:
        '200':
          description: Updated ticket summaries
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketSummary'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/tickets/bulk-move:
    post:
      summary: Bulk move tickets to another board and lane
      description: Moves all selected tickets in one transaction. If any selected ticket does not belong to the source board or the target board/lane is invalid, no tickets are moved.
      operationId: bulkMoveTickets
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                ticketIds:
                  type: array
                  items:
                    type: integer
                boardId:
                  type: integer
                laneId:
                  type: integer
              required: [ticketIds, boardId, laneId]
      responses:
        "200":
          description: Moved ticket summaries from the destination board
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
                required: [tickets]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/lanes/{laneId}/tickets/reorder:
    post:
      summary: Reorder a subset of non-archived tickets within one lane
      description: Listed tickets become the prefix in the requested order. Omitted non-archived tickets follow in their existing relative order; archived tickets remain last in their relative order. Empty ticketIds is a no-op. Validation and writes are atomic; invalid, duplicate, archived or other-lane IDs reject the whole request. Returns non-archived lane ticket summaries. Concurrent requests serialize; the later request applies to the latest order.
      operationId: reorderLaneTickets
      parameters:
        - $ref: "#/components/parameters/LaneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticketIds]
              properties:
                ticketIds:
                  type: array
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Non-archived lane ticket summaries
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/export:
    get:
      summary: Export board
      description: Boards with root-relative attachment URLs in rendered ticket, comment or Group Markdown use format 3 and embed each referenced file once. An incomplete or oversized portable export fails. Use a database and attachments backup for transfers exceeding 64 MiB.
      operationId: exportBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardExport"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}:
    get:
      summary: Get ticket detail
      operationId: getTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update ticket
      operationId: updateTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TicketUpdate'
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
              not:
                properties: { updater: {} }
                required: [updater]
                maxProperties: 1
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
        '409':
          $ref: '#/components/responses/GroupError'
        '428':
          $ref: '#/components/responses/GroupError'
      description: Atomically updates the ticket body and parent/child set. Different Groups require an allowed groupResolution and preview token.
        Existing-ticket groupId is not writable here; use membership endpoints.
    delete:
      summary: Delete ticket
      operationId: deleteTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/tickets/{ticketId}/archive:
    patch:
      operationId: setTicketArchiveState
      summary: Conditionally archive or restore one ticket
      description: >-
        Requires the detail response's archiveVersion and boardId. The generation
        changes when archive state or board changes, including bulk changes and
        restore-archive or board round trips. Unrelated edits do not invalidate
        it. A same-state request, stale generation or different board returns 409.
        Restoring follows normal archive ordering; it never restores an old ticket
        snapshot. This generation is local concurrency metadata, not export data.
      tags: [Tickets]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isArchived, expectedArchiveVersion, expectedBoardId]
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                isArchived:
                  type: boolean
                expectedArchiveVersion:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                expectedBoardId:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ticket'
                  - type: object
                    properties:
                      previousEditToken:
                        type: string
                        description: Atomic pre-mutation editor token. Only an equal draft baseline may adopt the returned editToken without reloading.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/tickets/{ticketId}/transition:
    patch:
      summary: Transition ticket by lane name
      operationId: transitionTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Resolve or reopen by destination lane. Completion flags are rejected with 400.
              not:
                anyOf:
                  - properties:
                      isResolved: {}
                    required: [isResolved]
                  - properties:
                      isCompleted: {}
                    required: [isCompleted]
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                laneName: { type: string }
              required: [laneName]
      responses:
        "200":
          description: Transitioned ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/position:
    patch:
      summary: Move ticket within its board by lane and position
      description: Moves one ticket to a lane on the same board and inserts it near the requested neighboring tickets, or at the requested numeric position when no anchors are provided. Other tickets in the affected lanes are reindexed server-side.
      operationId: positionTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                laneId:
                  type: integer
                position:
                  type: integer
                  minimum: 0
                beforeTicketId:
                  anyOf:
                    - type: integer
                    - type: "null"
                afterTicketId:
                  anyOf:
                    - type: integer
                    - type: "null"
                expectedSourceLaneId:
                  type: integer
                  minimum: 1
                  description: Current source lane captured before the move. Supply with expectedSourcePosition.
                expectedSourcePosition:
                  type: integer
                  description: Current source position captured before the move. Supply with expectedSourceLaneId.
                expectedAnchorOrder:
                  type: string
                  enum: [after-before, before-after]
                  description: Relative order of the distinct anchors in the target lane ordered by archived status, position, and ID. Required when the source precondition and two anchors are supplied.
              required: [laneId]
      responses:
        "200":
          description: Repositioned ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
          description: The source position, destination, or anchor membership or order changed before the guarded move. No move was saved.

  /api/tickets/{ticketId}/remote-refresh:
    post:
      summary: Refresh remote issue snapshot
      description: Re-fetches remote title/body/state for a tracked ticket. The local bodyMarkdown is not overwritten.
      operationId: refreshRemoteIssue
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "200":
          description: Refreshed tracked ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/external-references/{kind}:
    put:
      summary: Set external ticket reference
      description: Idempotently sets a non-tracking external reference for the ticket. External references do not participate in the one-import-per-remote-issue constraint and do not expose refresh, sync, or push actions.
      operationId: setTicketExternalReference
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/ExternalReferenceKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketExternalReferenceSet"
      responses:
        "200":
          description: Ticket with updated external references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove external ticket reference
      operationId: removeTicketExternalReference
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/ExternalReferenceKind"
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "200":
          description: Ticket with updated external references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/move:
    post:
      summary: Move ticket to another board and lane
      description: Moves one ticket to the target board and lane. When the target board differs from the source board, matching tag names are preserved and parent, child, and blocker links are cleared so relations do not cross boards.
      operationId: moveTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                boardId:
                  type: integer
                laneId:
                  type: integer
              required: [boardId, laneId]
      responses:
        "200":
          description: Moved ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"


  /api/tickets/{ticketId}/relations:
    get:
      summary: Get ticket relations
      operationId: getTicketRelations
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRelations"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/comments:
    get:
      summary: List comments
      description: Returns comments with the newest comment first.
      operationId: listComments
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: limit
          in: query
          description: Maximum number of comments. Omit to return all comments.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: order
          in: query
          description: Timestamp order, with comment ID as tie breaker. Default is newest first.
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Comment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                required: [comments]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add comment
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                bodyMarkdown:
                  type: string
              required: [bodyMarkdown]
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/tasks:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      summary: List Tasks in ticket-local number order
      operationId: listTicketTasks
      parameters:
        - name: q
          in: query
          description: Literal Markdown substring. ASCII letters are case-insensitive. Other characters and whitespace match literally.
          schema: { type: string }
        - name: done
          in: query
          description: Supply true or false, or omit to list both.
          schema: { type: boolean }
      responses:
        '200':
          description: Matching Tasks and unfiltered counts for the ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTasks'
        '400':
          $ref: '#/components/responses/TaskError'
        '404':
          $ref: '#/components/responses/TaskError'
    post:
      summary: Create a Task
      operationId: createTicketTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketTask'
      responses:
        '201':
          description: Created Task with its assigned number and revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTask'
        '400':
          $ref: '#/components/responses/TaskError'
        '404':
          $ref: '#/components/responses/TaskError'
        '409':
          $ref: '#/components/responses/TaskError'

  /api/tickets/{ticketId}/tasks/{taskNumber}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - name: taskNumber
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaskPositiveInteger'
    get:
      summary: Read a Task by ticket-local number
      operationId: getTicketTask
      responses:
        '200':
          description: Current Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTask'
        '400':
          $ref: '#/components/responses/TaskError'
        '404':
          $ref: '#/components/responses/TaskError'
    patch:
      summary: Edit Task Markdown or set its completion
      operationId: updateTicketTask
      description: Use the revision from the Task you reviewed. A request that matches the current revision and changes no fields leaves the revision and activity unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketTask'
      responses:
        '200':
          description: Current Task after the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTask'
        '400':
          $ref: '#/components/responses/TaskError'
        '404':
          $ref: '#/components/responses/TaskError'
        '409':
          $ref: '#/components/responses/TaskError'
        '428':
          $ref: '#/components/responses/TaskError'
    delete:
      summary: Delete a Task and retain its activity and allocated number
      operationId: deleteTicketTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTicketTask'
      responses:
        '204':
          description: Task deleted
        '400':
          $ref: '#/components/responses/TaskError'
        '404':
          $ref: '#/components/responses/TaskError'
        '409':
          $ref: '#/components/responses/TaskError'
        '428':
          $ref: '#/components/responses/TaskError'

  /api/comments/{commentId}:
    patch:
      summary: Update comment
      operationId: updateComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updater:
                  $ref: '#/components/schemas/OperationUpdater'
                bodyMarkdown:
                  type: string
              required: [bodyMarkdown]
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete comment
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "204":
          description: Deleted
        "400":
          $ref: '#/components/responses/Error'
        "404":
          $ref: "#/components/responses/Error"

  /api/comments/{commentId}/push-remote:
    post:
      summary: Push a local comment to the tracked remote issue
      description: Posts the local comment body to the linked remote issue and marks the comment as pushed. Already-pushed and in-progress comments are rejected to avoid duplicate remote comments.
      operationId: pushCommentToRemote
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "200":
          description: Comment with updated remote sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/change-snapshot:
    get:
      summary: Read a consistent ticket comparison endpoint
      description: Returns the endpoint values and committed activity watermark from one SQLite read transaction. Series identifies the database generation. Revision and activityThrough order observations inside that generation. Timestamps are display metadata and are not used as boundaries.
      operationId: getTicketChangeSnapshot
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: metadataOnly
          in: query
          description: Return only the series and subject fingerprint to check for updates while the detail is open.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Snapshot or update metadata, with Cache-Control no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TicketChangeSnapshot"
                  - $ref: "#/components/schemas/TicketChangeSnapshotMetadata"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/activity:
    get:
      summary: List ticket activity
      description: The default returns complete stored details ordered by creation time and activity ID descending. A bounded request uses activity ID descending. Both bounds are required for a bounded request, and the after bound is exclusive.
      operationId: listTicketActivity
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: compact
          in: query
          description: Omit recorded Markdown in the list and flag deferred text. Fetch one matching activity entry to read its full details.
          schema:
            type: boolean
            default: false
        - name: after
          in: query
          description: Exclusive activity watermark of the previous snapshot.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: through
          in: query
          description: Inclusive activity watermark of the current snapshot.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityLog"
                  series:
                    type: string
                    description: Present only for bounded requests. Compare this with the snapshot series before using the records.
                  historyPossiblyIncomplete:
                    type: boolean
                    description: Present only for bounded requests. True when deletion of this subject's history after the lower bound may overlap the requested interval.
                required: [activity]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/activity/{activityId}:
    get:
      summary: Read one recorded ticket activity entry
      description: Returns the full stored details, including any Markdown deferred by the compact list. The activity must belong to the specified subject ticket. Retained records can be read after ticket removal.
      operationId: getTicketActivity
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: series
          in: query
          description: Require the current database series when expanding a bounded activity entry.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Recorded activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLog"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/events:
    get:
      summary: List structured ticket events
      description: Returns machine-readable ticket events with the newest event first.
      operationId: listTicketEvents
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEventsResponse"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add structured ticket event
      description: Stores a source-specific event for AI and automation workflows without changing the regular activity log shape.
      operationId: addTicketEvent
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketEventCreateBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEvent"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/tag-reasons:
    get:
      summary: List ticket tag reasons
      description: Returns the ticket's currently attached tags with optional reason metadata.
      operationId: listTicketTagReasons
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Tag reason list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTagReasonsResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/tags/{tagId}:
    post:
      summary: Attach tag with optional reason
      description: Attaches an existing board tag to the ticket and upserts reason metadata for that tag.
      operationId: setTicketTagReason
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketTagReasonSetBody"
      responses:
        "200":
          description: Attached tag reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTagReason"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove tag from ticket
      operationId: removeTicketTag
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/TagId"
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        "204":
          description: Removed
        "400":
          $ref: '#/components/responses/Error'
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/groups:
    get:
      summary: List board Groups
      description: Defaults to active Groups. Empty Groups are active. Otherwise a Group is active while a member is unresolved and unarchived.
        Ticket archive filtering is independent.
      operationId: listGroups
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - all
          default: active
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - name
          default: createdAt
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupSummary'
                required:
                - groups
        '400': &id001x1
          $ref: '#/components/responses/GroupError'
        '404': &id002x1
          $ref: '#/components/responses/GroupError'
        '409': &id003x1
          $ref: '#/components/responses/GroupError'
        '428': &id004x1
          $ref: '#/components/responses/GroupError'
    post:
      summary: Create Group
      operationId: createGroup
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/groups/{groupId}:
    get:
      summary: Get Group, including inactive Groups
      operationId: getGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          headers:
            ETag:
              description: Quoted Group revision, for example "1".
              schema:
                type: string
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
    patch:
      summary: Edit Group with revision check
      operationId: updateGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Updated Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
    delete:
      summary: Delete an empty Group
      description: Archived tickets count as members. The revision and empty state are checked atomically; no tickets are deleted.
      operationId: deleteGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: ETag from the Group GET response.
      requestBody:
        $ref: '#/components/requestBodies/OptionalOperationUpdater'
      responses:
        '204':
          description: Deleted
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/group-memberships/preview:
    post:
      summary: Preview parent/child Group membership change
      description: Read-only. Expands selected tickets to the connected parent/child set, including archived members. Direct changes between non-null
        Groups are rejected.
      operationId: previewGroupMemberships
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembershipRequest'
      responses:
        '200':
          description: Membership preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipPreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/group-memberships:
    put:
      summary: Apply Group membership change atomically
      description: Use the same body as preview plus its expectedToken. A stale token causes no writes. To change Groups, remove membership then
        add the destination.
      operationId: applyGroupMemberships
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembershipApply'
      responses:
        '200':
          description: Changed members and affected Groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipResult'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/tickets/preview:
    post:
      summary: Preview ticket creation and Group resolution
      description: Does not insert a ticket. Parent/Group conflicts produce candidates; previously ungrouped parent/child tickets join the one assigned
        Group automatically.
      operationId: previewTicketCreate
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '200':
          description: Creation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChangePreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/tickets/{ticketId}/change-preview:
    post:
      summary: Preview atomic ticket and parent/child edits
      description: Keep the original editToken; do not replace it with a fresh token to replay an obsolete child set. Conflicting Groups return
        candidate choices without writing.
      operationId: previewTicketChange
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Change preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChangePreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/markdown/preview:
    post:
      summary: Render a Markdown preview
      description: Read-only rendering using the same Markdown sanitizer as ticket and Group descriptions.
      operationId: previewMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyMarkdown:
                  type: string
                  maxLength: 100000
              required:
              - bodyMarkdown
      responses:
        '200':
          description: Sanitized HTML
          content:
            application/json:
              schema:
                type: object
                properties:
                  bodyHtml:
                    type: string
                required:
                - bodyHtml
        '400':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/group-activity:
    get:
      summary: Read board Group activity
      operationId: listGroupActivity
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: groupId
        in: query
        schema:
          type: integer
          minimum: 1
        description: Optional subject Group ID, including a deleted Group.
      responses:
        '200':
          description: Newest first Group activity, retained after Group deletion.
          content:
            application/json:
              schema:
                type: object
                required:
                - activity
                properties:
                  activity:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - boardId
                      - groupId
                      - action
                      - details
                      - createdAt
                      - updater
                      properties:
                        id:
                          type: integer
                        boardId:
                          type: integer
                        groupId:
                          type: integer
                        action:
                          type: string
                        details:
                          type: object
                          additionalProperties: true
                        updater:
                          $ref: '#/components/schemas/RecordedUpdater'
                        createdAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
components:
  requestBodies:
    OptionalOperationUpdater:
      description: Optional metadata for this operation. An omitted body or field defaults to API.
      content:
        application/json:
          schema:
            type: object
            properties:
              updater:
                $ref: '#/components/schemas/OperationUpdater'
  parameters:
    TicketCollectionLimit:
      name: limit
      in: query
      required: true
      description: Page size. May change between requests.
      schema: { type: integer, minimum: 1, maximum: 200 }
    TicketProjectionPageLimit:
      name: limit
      in: query
      required: true
      description: Page size for Group rows and List references. Start at 200 or fewer to support versions without the page-limit response header.
      schema: { type: integer, minimum: 1, maximum: 800 }
    TicketCollectionCursor:
      name: cursor
      in: query
      description: Opaque nextCursor for the same projection, board and filters. A changed revision returns 409 and requires restarting.
      schema: { type: string, minLength: 1, maxLength: 4096 }
    TicketLaneIds:
      name: lane_ids
      in: query
      description: Comma-separated positive safe integer lane IDs. Matches any selected lane. Omit for all lanes. Unknown IDs match no tickets. Duplicate IDs and list order are normalized. Cannot be combined with lane_id or lane.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
      example: '1,2'
    TicketTagIds:
      name: tag_ids
      in: query
      description: Comma-separated positive safe integer tag IDs on the board. Matches any selected tag once per ticket. Omit for all tags. Unknown IDs match no tickets. Duplicate IDs and list order are normalized. Cannot be combined with tag.
      schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' }
      example: '3,4'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: integer
    LaneId:
      name: laneId
      in: path
      required: true
      schema:
        type: integer
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
    ExternalReferenceKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
  responses:
    CustomView:
      description: Saved definition with its ID, current version, sort and each rule's lane fields
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CustomViewDefinition'
              - $ref: '#/components/schemas/CustomViewSummary'
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required: [error]
    GroupError:
      description: Group or edit error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupErrorBody'
    TaskError:
      description: Invalid Task input, missing Task or ticket, missing revision, or stale revision
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              code:
                type: string
                description: PRECONDITION_REQUIRED for an omitted revision or STALE_TASK for a conflicting revision. Reload and review the change before retrying a conflict.
  schemas:
    OperationUpdater:
      type: string
      minLength: 1
      maxLength: 80
      allOf:
        - pattern: '\S'
        - not:
            pattern: '[\u0000-\u001F\u007F-\u009F]'
      description: Self-reported name preserved exactly in operation history. Omit for API. Requires valid Unicode, at least one non-whitespace character and no control characters.
      example: Reviewer
    RecordedUpdater:
      type: [string, 'null']
      description: Updater captured when the operation was recorded. Older records without an updater use null.
    TaskPositiveInteger:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    TaskMarkdown:
      type: string
      minLength: 1
      maxLength: 100000
      pattern: '\S'
      description: Nonblank Task Markdown containing well-formed Unicode. Original spacing and line endings are preserved.
    TaskTotalCount:
      type: integer
      minimum: 0
      readOnly: true
      description: Number of existing Tasks on the ticket, independent of filters.
    TaskDoneCount:
      type: integer
      minimum: 0
      readOnly: true
      description: Number of done Tasks on the ticket, independent of filters and ticket completion.
    TicketTaskRecord:
      type: object
      required: [number, bodyMarkdown, done, revision]
      properties:
        number:
          $ref: '#/components/schemas/TaskPositiveInteger'
          description: Server-assigned number unique within this ticket. Deleted numbers are never assigned again.
        bodyMarkdown:
          $ref: '#/components/schemas/TaskMarkdown'
        done: { type: boolean }
        revision:
          $ref: '#/components/schemas/TaskPositiveInteger'
          description: Starts at 1 and advances on a change. Pass it as expectedRevision for mutations of an existing Task.
