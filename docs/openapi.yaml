openapi: 3.1.0
info:
  title: Kanbalone API
  version: 1.0.0-rc.2
  summary: Ultra-light local personal kanban API for human and AI collaboration
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:3000
security: []
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/meta:
    get:
      summary: Get app metadata
      operationId: getMeta
      responses:
        "200":
          description: App metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  remoteProviders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hasCredential:
                          type: boolean
                      required: [id, hasCredential]
                required: [name, version, remoteProviders]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/remote-diagnostics:
    get:
      summary: List remote provider diagnostic status
      operationId: listRemoteProviderDiagnostics
      responses:
        "200":
          description: Remote provider credential configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hasCredential:
                          type: boolean
                        status:
                          type: string
                          enum: [configured, missing_credential]
                      required: [id, hasCredential, status]
                required: [providers]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Check a remote issue credential
      description: Attempts to resolve a remote issue with an exact-scope configured provider credential and returns a token-safe diagnostic result. Wildcard credentials are not used for user-supplied diagnostic URLs.
      operationId: checkRemoteCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteDiagnosticRequest"
      responses:
        "200":
          description: Remote issue is reachable with the configured credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDiagnosticResult"
        "400":
          description: Diagnostic failed or the provider is unsupported/missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDiagnosticResult"
        "500":
          $ref: "#/components/responses/Error"

  /api/boards:
    get:
      summary: List boards
      operationId: listBoards
      responses:
        "200":
          description: Board list
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
                required: [boards]
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      summary: Create board
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                laneNames:
                  type: array
                  items:
                    type: string
              required: [name]
      responses:
        "201":
          description: Created board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/Error"

  /api/boards/import:
    post:
      summary: Import a board
      description: Supports local board import payloads, including larger seed datasets used for bulk local setup and performance testing.
      operationId: importBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardImport"
      responses:
        "201":
          description: Imported board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}:
    get:
      summary: Get board shell
      operationId: getBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Board shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardShell"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename board
      operationId: updateBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete board and related data
      operationId: deleteBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/events:
    get:
      summary: Subscribe to board updates via SSE
      operationId: subscribeBoardEvents
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"boardId":3,"event":"board_updated","sentAt":"2026-04-10T00:00:00.000Z"}
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/lanes:
    get:
      summary: List lanes
      operationId: listLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Lane list
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
                required: [lanes]
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create lane
      operationId: createLane
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                isCompletionLane:
                  type: boolean
                  description: Determines completion for all tickets in this lane, including archived tickets.
              required: [name]
      responses:
        "201":
          description: Created lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/lanes/reorder:
    post:
      summary: Reorder lanes
      operationId: reorderLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                laneIds:
                  type: array
                  items:
                    type: integer
              required: [laneIds]
      responses:
        "200":
          description: Reordered lanes
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
                required: [lanes]
        "400":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/completion-lanes:
    put:
      summary: Atomically replace the completion lane selection
      description: All lane attributes and affected ticket states change together. expectedLanes must contain every current lane, its completion attribute and its total ticket count including archived tickets. Stale expectations return 409 without changes.
      operationId: setCompletionLanes
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [laneIds, expectedLanes]
              properties:
                laneIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                expectedLanes:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, isCompletionLane, ticketCount]
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      isCompletionLane:
                        type: boolean
                      ticketCount:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Updated lanes
          content:
            application/json:
              schema:
                type: object
                required: [lanes]
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/lanes/{laneId}:
    patch:
      summary: Update lane name or completion
      operationId: updateLane
      parameters:
        - $ref: "#/components/parameters/LaneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                isCompletionLane:
                  type: boolean
                  description: Determines completion for all tickets in this lane, including archived tickets.
              minProperties: 1
      responses:
        "200":
          description: Updated lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lane"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete empty lane
      operationId: deleteLane
      parameters:
        - $ref: "#/components/parameters/LaneId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tags:
    get:
      summary: List tags
      operationId: listTags
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
                required: [tags]
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create tag
      operationId: createTag
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
              required: [name]
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tags/{tagId}:
    patch:
      summary: Update tag
      operationId: updateTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete tag
      operationId: deleteTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets:
    get:
      summary: List ticket summaries
      description: Lightweight summary endpoint for board rendering, filtering, search, and automation on large boards. Fetch individual ticket
        detail separately when body, comments, or expanded relations are needed. Use resolved for completion filtering; the removed completed query alias returns 400.
      operationId: listTickets
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: lane_id
        in: query
        schema:
          type: integer
      - name: lane
        in: query
        description: Exact lane name. Cannot be combined with lane_id. Unknown names return an empty list.
        schema:
          type: string
          minLength: 1
      - name: parent
        in: query
        description: Direct parent ticket ID, or none for tickets without a parent. Does not include all descendants.
        schema:
          type: string
          pattern: ^(none|[1-9][0-9]*)$
      - name: tag
        in: query
        schema:
          type: string
      - name: resolved
        in: query
        schema:
          type: boolean
      - name: archived
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - all
      - name: q
        in: query
        description: Search title, body Markdown, local ticket refs such as
        schema:
          type: string
      - name: groupId
        in: query
        schema:
          type: integer
          minimum: 1
        description: Group on this board; mutually exclusive with ungrouped=true.
      - name: ungrouped
        in: query
        schema:
          type: boolean
        description: Only ungrouped tickets. Cannot be combined with groupId.
      - name: includeArchived
        in: query
        schema:
          type: boolean
        description: Alias for including archived tickets when archived is omitted. Prefer archived=all.
      responses:
        '200':
          description: Ticket summary list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketSummary'
                required:
                - tickets
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Create ticket
      operationId: createTicket
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
        '409':
          $ref: '#/components/responses/GroupError'
        '428':
          $ref: '#/components/responses/GroupError'

  /api/boards/{boardId}/remote-import:
    post:
      summary: Import a remote issue into a board
      description: Creates one local ticket from a remote issue snapshot. The created ticket uses the remote title and copies the remote body into the local body for initial implementation context. Remote metadata is tracked on the ticket, but board export omits it.
      operationId: importRemoteIssue
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteIssueImport"
      responses:
        "201":
          description: Imported tracked ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/remote-import/preview:
    post:
      summary: Preview a remote issue before import
      description: Resolves a remote issue without creating a local ticket and reports whether the remote issue has already been imported.
      operationId: previewRemoteIssueImport
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteIssueImport"
      responses:
        "200":
          description: Remote issue preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteIssueImportPreview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets/bulk-transition:
    post:
      summary: Bulk transition tickets by lane name
      operationId: bulkTransitionTickets
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Resolve or reopen by destination lane. Completion flags are rejected with 400.
              not:
                anyOf:
                  - properties:
                      isResolved: {}
                    required: [isResolved]
                  - properties:
                      isCompleted: {}
                    required: [isCompleted]
              properties:
                ticketIds:
                  type: array
                  items:
                    type: integer
                laneName:
                  type: string
              required: [ticketIds, laneName]
      responses:
        "200":
          description: Updated ticket summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
                required: [tickets]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

        "409":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/tickets/bulk-move:
    post:
      summary: Bulk move tickets to another board and lane
      description: Moves all selected tickets in one transaction. If any selected ticket does not belong to the source board or the target board/lane is invalid, no tickets are moved.
      operationId: bulkMoveTickets
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketIds:
                  type: array
                  items:
                    type: integer
                boardId:
                  type: integer
                laneId:
                  type: integer
              required: [ticketIds, boardId, laneId]
      responses:
        "200":
          description: Moved ticket summaries from the destination board
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
                required: [tickets]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/lanes/{laneId}/tickets/reorder:
    post:
      summary: Reorder a subset of non-archived tickets within one lane
      description: Listed tickets become the prefix in the requested order. Omitted non-archived tickets follow in their existing relative order; archived tickets remain last in their relative order. Empty ticketIds is a no-op. Validation and writes are atomic; invalid, duplicate, archived or other-lane IDs reject the whole request. Returns non-archived lane ticket summaries. Concurrent requests serialize; the later request applies to the latest order.
      operationId: reorderLaneTickets
      parameters:
        - $ref: "#/components/parameters/LaneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticketIds]
              properties:
                ticketIds:
                  type: array
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Non-archived lane ticket summaries
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketSummary"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/export:
    get:
      summary: Export board
      operationId: exportBoard
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardExport"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}:
    get:
      summary: Get ticket detail
      operationId: getTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update ticket
      operationId: updateTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
        '409':
          $ref: '#/components/responses/GroupError'
        '428':
          $ref: '#/components/responses/GroupError'
      description: Atomically updates the ticket body and parent/child set. Different Groups require an allowed groupResolution and preview token.
        Existing-ticket groupId is not writable here; use membership endpoints.
    delete:
      summary: Delete ticket
      operationId: deleteTicket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'

  /api/tickets/{ticketId}/transition:
    patch:
      summary: Transition ticket by lane name
      operationId: transitionTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Resolve or reopen by destination lane. Completion flags are rejected with 400.
              not:
                anyOf:
                  - properties:
                      isResolved: {}
                    required: [isResolved]
                  - properties:
                      isCompleted: {}
                    required: [isCompleted]
              properties:
                laneName: { type: string }
              required: [laneName]
      responses:
        "200":
          description: Transitioned ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/position:
    patch:
      summary: Move ticket within its board by lane and position
      description: Moves one ticket to a lane on the same board and inserts it near the requested neighboring tickets, or at the requested numeric position when no anchors are provided. Other tickets in the affected lanes are reindexed server-side.
      operationId: positionTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                laneId:
                  type: integer
                position:
                  type: integer
                  minimum: 0
                beforeTicketId:
                  anyOf:
                    - type: integer
                    - type: "null"
                afterTicketId:
                  anyOf:
                    - type: integer
                    - type: "null"
              required: [laneId]
      responses:
        "200":
          description: Repositioned ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/remote-refresh:
    post:
      summary: Refresh remote issue snapshot
      description: Re-fetches remote title/body/state for a tracked ticket. The local bodyMarkdown is not overwritten.
      operationId: refreshRemoteIssue
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Refreshed tracked ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/external-references/{kind}:
    put:
      summary: Set external ticket reference
      description: Idempotently sets a non-tracking external reference for the ticket. External references do not participate in the one-import-per-remote-issue constraint and do not expose refresh, sync, or push actions.
      operationId: setTicketExternalReference
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/ExternalReferenceKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketExternalReferenceSet"
      responses:
        "200":
          description: Ticket with updated external references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove external ticket reference
      operationId: removeTicketExternalReference
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/ExternalReferenceKind"
      responses:
        "200":
          description: Ticket with updated external references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/move:
    post:
      summary: Move ticket to another board and lane
      description: Moves one ticket to the target board and lane. When the target board differs from the source board, matching tag names are preserved and parent, child, and blocker links are cleared so relations do not cross boards.
      operationId: moveTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                boardId:
                  type: integer
                laneId:
                  type: integer
              required: [boardId, laneId]
      responses:
        "200":
          description: Moved ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"


  /api/tickets/{ticketId}/relations:
    get:
      summary: Get ticket relations
      operationId: getTicketRelations
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRelations"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/comments:
    get:
      summary: List comments
      description: Returns comments with the newest comment first.
      operationId: listComments
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: limit
          in: query
          description: Maximum number of comments. Omit to return all comments.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: order
          in: query
          description: Timestamp order, with comment ID as tie breaker. Default is newest first.
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Comment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                required: [comments]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add comment
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyMarkdown:
                  type: string
              required: [bodyMarkdown]
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/comments/{commentId}:
    patch:
      summary: Update comment
      operationId: updateComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyMarkdown:
                  type: string
              required: [bodyMarkdown]
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete comment
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/comments/{commentId}/push-remote:
    post:
      summary: Push a local comment to the tracked remote issue
      description: Posts the local comment body to the linked remote issue and marks the comment as pushed. Already-pushed and in-progress comments are rejected to avoid duplicate remote comments.
      operationId: pushCommentToRemote
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment with updated remote sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/activity:
    get:
      summary: List ticket activity
      description: Returns activity entries with the newest entry first.
      operationId: listTicketActivity
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityLog"
                required: [activity]
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/events:
    get:
      summary: List structured ticket events
      description: Returns machine-readable ticket events with the newest event first.
      operationId: listTicketEvents
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEventsResponse"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add structured ticket event
      description: Stores a source-specific event for AI and automation workflows without changing the regular activity log shape.
      operationId: addTicketEvent
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketEventCreateBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEvent"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/tag-reasons:
    get:
      summary: List ticket tag reasons
      description: Returns the ticket's currently attached tags with optional reason metadata.
      operationId: listTicketTagReasons
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Tag reason list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTagReasonsResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{ticketId}/tags/{tagId}:
    post:
      summary: Attach tag with optional reason
      description: Attaches an existing board tag to the ticket and upserts reason metadata for that tag.
      operationId: setTicketTagReason
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketTagReasonSetBody"
      responses:
        "200":
          description: Attached tag reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTagReason"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove tag from ticket
      operationId: removeTicketTag
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

  /api/boards/{boardId}/groups:
    get:
      summary: List board Groups
      description: Defaults to active Groups. Empty Groups are active. Otherwise a Group is active while a member is unresolved and unarchived.
        Ticket archive filtering is independent.
      operationId: listGroups
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - all
          default: active
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - name
          default: createdAt
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupSummary'
                required:
                - groups
        '400': &id001x1
          $ref: '#/components/responses/GroupError'
        '404': &id002x1
          $ref: '#/components/responses/GroupError'
        '409': &id003x1
          $ref: '#/components/responses/GroupError'
        '428': &id004x1
          $ref: '#/components/responses/GroupError'
    post:
      summary: Create Group
      operationId: createGroup
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/groups/{groupId}:
    get:
      summary: Get Group, including inactive Groups
      operationId: getGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          headers:
            ETag:
              description: Quoted Group revision, for example "1".
              schema:
                type: string
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
    patch:
      summary: Edit Group with revision check
      operationId: updateGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Updated Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
    delete:
      summary: Delete an empty Group
      description: Archived tickets count as members. The revision and empty state are checked atomically; no tickets are deleted.
      operationId: deleteGroup
      parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: ETag from the Group GET response.
      responses:
        '204':
          description: Deleted
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/group-memberships/preview:
    post:
      summary: Preview parent/child Group membership change
      description: Read-only. Expands selected tickets to the connected parent/child set, including archived members. Direct changes between non-null
        Groups are rejected.
      operationId: previewGroupMemberships
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembershipRequest'
      responses:
        '200':
          description: Membership preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipPreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/group-memberships:
    put:
      summary: Apply Group membership change atomically
      description: Use the same body as preview plus its expectedToken. A stale token causes no writes. To change Groups, remove membership then
        add the destination.
      operationId: applyGroupMemberships
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembershipApply'
      responses:
        '200':
          description: Changed members and affected Groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipResult'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/boards/{boardId}/tickets/preview:
    post:
      summary: Preview ticket creation and Group resolution
      description: Does not insert a ticket. Parent/Group conflicts produce candidates; previously ungrouped parent/child tickets join the one assigned
        Group automatically.
      operationId: previewTicketCreate
      parameters:
      - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '200':
          description: Creation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChangePreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/tickets/{ticketId}/change-preview:
    post:
      summary: Preview atomic ticket and parent/child edits
      description: Keep the original editToken; do not replace it with a fresh token to replay an obsolete child set. Conflicting Groups return
        candidate choices without writing.
      operationId: previewTicketChange
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Change preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChangePreview'
        '400': *id001x1
        '404': *id002x1
        '409': *id003x1
        '428': *id004x1
  /api/markdown/preview:
    post:
      summary: Render a Markdown preview
      description: Read-only rendering using the same Markdown sanitizer as ticket and Group descriptions.
      operationId: previewMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyMarkdown:
                  type: string
                  maxLength: 100000
              required:
              - bodyMarkdown
      responses:
        '200':
          description: Sanitized HTML
          content:
            application/json:
              schema:
                type: object
                properties:
                  bodyHtml:
                    type: string
                required:
                - bodyHtml
        '400':
          $ref: '#/components/responses/Error'

  /api/boards/{boardId}/group-activity:
    get:
      summary: Read board Group activity
      operationId: listGroupActivity
      parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: groupId
        in: query
        schema:
          type: integer
          minimum: 1
        description: Optional subject Group ID, including a deleted Group.
      responses:
        '200':
          description: Newest first Group activity, retained after Group deletion.
          content:
            application/json:
              schema:
                type: object
                required:
                - activity
                properties:
                  activity:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - boardId
                      - groupId
                      - action
                      - details
                      - createdAt
                      properties:
                        id:
                          type: integer
                        boardId:
                          type: integer
                        groupId:
                          type: integer
                        action:
                          type: string
                        details:
                          type: object
                          additionalProperties: true
                        createdAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/GroupError'
        '404':
          $ref: '#/components/responses/GroupError'
components:
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: integer
    LaneId:
      name: laneId
      in: path
      required: true
      schema:
        type: integer
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
    ExternalReferenceKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required: [error]
    GroupError:
      description: Group or edit error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupErrorBody'
  schemas:
    GroupSummary:
      type: object
      properties:
        id: &schemaid001x1
          type: integer
          minimum: 1
        boardId: *schemaid001x1
        name:
          type: string
        revision: *schemaid001x1
        isActive:
          type: boolean
        totalTicketCount:
          type: integer
          minimum: 0
        openTicketCount:
          type: integer
          minimum: 0
        archivedTicketCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - boardId
      - name
      - revision
      - isActive
      - totalTicketCount
      - openTicketCount
      - archivedTicketCount
      - createdAt
      - updatedAt
    Group:
      allOf:
      - $ref: '#/components/schemas/GroupSummary'
      - type: object
        properties:
          descriptionMarkdown:
            type: string
          descriptionHtml:
            type: string
        required:
        - descriptionMarkdown
        - descriptionHtml
    GroupReference:
      oneOf:
      - type: object
        properties:
          id: *schemaid001x1
          name:
            type: string
        required:
        - id
        - name
      - type: 'null'
    GroupCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed and NFC-normalized; exact duplicate names on the same board, including inactive Groups, are rejected.
        descriptionMarkdown:
          type: string
          maxLength: 100000
      required:
      - name
      additionalProperties: false
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        descriptionMarkdown:
          type: string
          maxLength: 100000
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - expectedRevision
      minProperties: 2
      additionalProperties: false
    GroupResolution:
      type: object
      properties:
        groupId: *schemaid001x1
      required:
      - groupId
    GroupMembershipRequest:
      type: object
      properties:
        ticketIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: *schemaid001x1
        groupId: &schemaid002x1
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - ticketIds
      - groupId
    GroupMembershipApply:
      allOf:
      - $ref: '#/components/schemas/GroupMembershipRequest'
      - type: object
        properties:
          expectedToken:
            type: string
            minLength: 1
        required:
        - expectedToken
    GroupPreviewTicket:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          description: 'Existing ticket ID, or 0 for the proposed new ticket (clientRef: new); never send 0 as a persisted ticket
            ID.'
        clientRef:
          type: string
        title:
          type: string
        boardId:
          type: integer
          minimum: 1
        parentTicketId:
          type:
          - integer
          - 'null'
          minimum: 1
        groupId:
          type:
          - integer
          - 'null'
          minimum: 1
        isArchived:
          type: boolean
      required:
      - title
      - parentTicketId
      - groupId
      - isArchived
      - id
      - boardId
    GroupChangePreview:
      type: object
      properties:
        expectedToken:
          type: string
        requiresResolution:
          type: boolean
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/GroupPreviewTicket'
        parentChanges:
          type: array
          items:
            type: object
            properties:
              ticketId:
                type: integer
                minimum: 0
              fromParentTicketId:
                type:
                - integer
                - 'null'
                minimum: 1
              toParentTicketId:
                type:
                - integer
                - 'null'
                minimum: 0
            required:
            - ticketId
            - fromParentTicketId
            - toParentTicketId
        candidates:
          type: array
          items:
            type: object
            properties:
              group:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 1
                  name:
                    type: string
                required:
                - id
                - name
              changedTicketIds:
                type: array
                items:
                  type: integer
                  minimum: 0
            required:
            - group
            - changedTicketIds
        changedTicketIds:
          type: array
          items:
            type: integer
            minimum: 0
        targetGroupId:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - expectedToken
      - requiresResolution
      - tickets
      - parentChanges
      - candidates
      - changedTicketIds
      - targetGroupId
    GroupMembershipPreview:
      allOf:
      - $ref: '#/components/schemas/GroupChangePreview'
      description: Membership previews never require Group resolution; candidates and parentChanges are empty. changedTicketIds
        contains persisted IDs.
    GroupMembershipResult:
      type: object
      properties:
        changedTickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        affectedGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
      required:
      - changedTickets
      - affectedGroups
    TicketCreate:
      allOf:
      - $ref: '#/components/schemas/TicketUpsert'
      - type: object
        properties:
          groupId: *schemaid002x1
          groupResolution:
            $ref: '#/components/schemas/GroupResolution'
          expectedToken:
            type: string
        required:
        - laneId
        - title
    GroupErrorBody:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable Group or edit error code.
        details:
          type: object
          additionalProperties: true
          description: Current preview or conflict context, when available.
      required:
      - error
    GroupExport:
      type: object
      properties:
        id: *schemaid001x1
        name:
          type: string
        descriptionMarkdown:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - descriptionMarkdown
      - createdAt
      - updatedAt
    LegacyBoardExport:
      properties:
        board:
          $ref: '#/components/schemas/Board'
        lanes:
          items:
            $ref: '#/components/schemas/Lane'
          type: array
        tags:
          items:
