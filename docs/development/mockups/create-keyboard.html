* {
  box-sizing: border-box;
}

html {
  font-size: var(--font-size-body);
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-family-ui);
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-regular);
  line-height: var(--line-height-body);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

html.dialog-scroll-locked {
  overflow: hidden;
}

body.dialog-scroll-locked {
  overflow: hidden;
}

body.editor-dialog-open::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  pointer-events: auto;
  z-index: 9;
}

input {
  font: inherit;
  line-height: var(--line-height-control);
}

select {
  font: inherit;
  line-height: var(--line-height-control);
}

textarea {
  font: inherit;
  line-height: var(--line-height-body);
}

:root {
  --scrollbar-size: 12px;
  --scrollbar-track: color-mix(
    in srgb,
    var(--surface-canvas) 78%,
    var(--surface-1)
  );
  --scrollbar-thumb: color-mix(
    in srgb,
    var(--text-muted) 56%,
    transparent
  );
  --scrollbar-thumb-hover: color-mix(
    in srgb,
    var(--accent) 72%,
    var(--text-muted)
  );
  --scrollbar-thumb-active: var(--accent-hover);
  --scrollbar-corner: var(--surface-canvas);
}

* {
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  scrollbar-width: thin;
}

*::-webkit-scrollbar {
  width: var(--scrollbar-size);
  height: var(--scrollbar-size);
}

*::-webkit-scrollbar-track {
  background-color: var(--scrollbar-track);
  border-radius: var(--radius-control);
}

*::-webkit-scrollbar-thumb {
  min-width: 40px;
  min-height: 40px;
  background-clip: padding-box;
  background-color: var(--scrollbar-thumb);
  border: 3px solid transparent;
  border-radius: var(--radius-control);
}

*::-webkit-scrollbar-thumb:hover {
  background-color: var(--scrollbar-thumb-hover);
}

*::-webkit-scrollbar-thumb:active {
  background-color: var(--scrollbar-thumb-active);
}

*::-webkit-scrollbar-corner {
  background-color: var(--scrollbar-corner);
}

button {
  font: inherit;
  font-size: var(--font-size-control);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-control);
  border: 1px solid var(--line);
  background: var(--panel-strong);
  color: var(--text);
  padding: 0.65rem 0.9rem;
  border-radius: var(--radius-control);
  cursor: pointer;
}

.import-button {
  border: 1px solid var(--line);
  background: var(--panel-strong);
  color: var(--text);
  font-size: var(--font-size-control);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-control);
  padding: 0.65rem 0.9rem;
  border-radius: var(--radius-control);
  cursor: pointer;
}

button:hover {
  border-color: var(--accent);
}

.import-button:hover {
  border-color: var(--accent);
}

.ghost {
  background: transparent;
}

.ghost.active {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-color: color-mix(in srgb, var(--accent) 22%, transparent);
  color: var(--accent);
}

.danger {
  color: var(--danger);
}

.primary-action {
  border-color: color-mix(in srgb, var(--accent) 80%, transparent);
  background: var(--accent);
  color: var(--on-accent);
}

.primary-action:hover {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.action-with-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}

.action-with-icon .icon {
  width: var(--icon-size-default);
  height: var(--icon-size-default);
}

.danger-confirm-action {
  border-color: var(--danger);
  background: var(--danger);
  color: var(--on-accent);
}

.danger-confirm-action:hover {
  border-color: color-mix(in srgb, var(--danger) 76%, black);
  background: color-mix(in srgb, var(--danger) 76%, black);
  color: var(--on-accent);
}

.import-button.icon-button {
  position: relative;
  overflow: hidden;
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--control-size-icon);
  width: var(--control-size-icon);
  height: var(--control-size-icon);
  padding: 0;
  line-height: 1;
}

.icon {
  display: inline-block;
  flex: 0 0 auto;
  width: var(--icon-size-default);
  height: var(--icon-size-default);
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.icon-button .icon {
  width: var(--icon-size-button);
  height: var(--icon-size-button);
}

.ticket-tag-chip .icon {
  width: var(--icon-size-small);
  height: var(--icon-size-small);
  stroke-width: 2.4;
}

.tag-picker-check .icon {
  width: var(--icon-size-default);
  height: var(--icon-size-default);
  stroke-width: 2.4;
}

.toolbar input,
.toolbar select,
.editor-form input,
.editor-form select,
.ux-fields input,
.ux-fields select {
  width: 100%;
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);
  background: var(--control-bg);
  color: var(--text);
  font-size: var(--font-size-control);
  font-weight: var(--font-weight-regular);
  line-height: var(--line-height-control);
  padding: 0.65rem 0.8rem;
}

.toolbar select {
  color: var(--muted);
  accent-color: var(--accent);
}

.toolbar select option {
  background: var(--panel);
  color: var(--text);
}

.toolbar .toolbar-search input {
  min-width: 0;
  border: none;
  background: transparent;
  padding: 0;
  outline: none;
}

.editor-form textarea,
.comment-form textarea,
.ux-fields textarea {
  line-height: var(--line-height-body);
  width: 100%;
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);
  background: var(--control-bg);
  color: var(--text);
  font-size: var(--font-size-control);
  font-weight: var(--font-weight-regular);
  padding: 0.65rem 0.8rem;
}

.editor-form input:not([type="checkbox"]):not([type="hidden"]):focus,
.editor-form select:focus,
.editor-form textarea:focus,
.comment-form textarea:focus,
.ux-fields input:focus,
.ux-fields select:focus,
.ux-fields textarea:focus {
  border-color: var(--control-focus-border);
  box-shadow: var(--control-focus-ring);
  outline: none;
}

.completion-toggle {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 0.5rem;
}

.toggle-switch-input,
.completion-toggle input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.toggle-switch-control,
.completion-toggle-control {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  min-height: 2.75rem;
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  color: var(--muted);
  cursor: pointer;
  transition:
    background var(--motion-normal) var(--ease-standard),
    border-color var(--motion-normal) var(--ease-standard),
    color var(--motion-normal) var(--ease-standard);
}

.ux-color-enable-switch .toggle-switch-control {
  flex: 0 0 auto;
  width: 100%;
  min-height: 2.5rem;
  padding: 0.55rem;
}

.toggle-switch-knob,
.completion-switch {
  position: relative;
  flex: 0 0 auto;
  width: 3rem;
  height: 1.25rem;
  border: 1px solid color-mix(in srgb, var(--text-muted) 28%, transparent);
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--text-muted) 12%, transparent);
  transition:
    background var(--motion-normal) var(--ease-standard),
    border-color var(--motion-normal) var(--ease-standard);
}

.toggle-switch-knob::after,
.completion-switch::after {
  position: absolute;
  top: 0.15rem;
  left: 0.15rem;
  width: var(--icon-size-small);
  height: var(--icon-size-small);
  border-radius: var(--radius-pill);
  background: var(--control-knob);
  box-shadow: var(--shadow-card);
  content: "";
  transition: transform var(--motion-normal) var(--ease-standard);
}

.toggle-switch-input:focus-visible + .toggle-switch-control,
.completion-toggle input:focus-visible + .completion-toggle-control {
  outline: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
  outline-offset: 2px;
}

.toggle-switch-input:checked + .toggle-switch-control,
.completion-toggle input:checked + .completion-toggle-control {
  border-color: color-mix(in srgb, var(--accent) 70%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent);
}

.toggle-switch-input:checked + .toggle-switch-control .toggle-switch-knob,
.completion-toggle
  input:checked
  + .completion-toggle-control
  .completion-switch {
  border-color: color-mix(in srgb, var(--accent) 75%, transparent);
  background: var(--accent);
}

.toggle-switch-input:checked
  + .toggle-switch-control
  .toggle-switch-knob::after,
.completion-toggle
  input:checked
  + .completion-toggle-control
  .completion-switch::after {
  transform: translateX(1.75rem);
}

.shell {
  position: relative;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  min-height: 100vh;
  overflow-x: clip;
  transition: grid-template-columns var(--motion-fast) var(--ease-standard);
}

.shell.sidebar-collapsed {
  grid-template-columns: 0 minmax(0, 1fr);
}

.sidebar {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  width: 280px;
  max-width: 280px;
  border-right: 1px solid color-mix(in srgb, var(--text-muted) 18%, transparent);
  padding: var(--space-4);
  backdrop-filter: blur(6px);
  overflow: hidden;
  transform: translateX(0);
  transition:
    transform var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard);
}

.shell.sidebar-collapsed .sidebar {
  border-right-color: transparent;
  transform: translateX(-100%);
  pointer-events: none;
}

.sidebar-edge-toggle {
  position: fixed;
  top: 50%;
  left: 280px;
  transform: translate(-50%, -50%);
  z-index: 3;
  width: 1.7rem;
  min-width: 1.7rem;
  height: 1.7rem;
  padding: 0;
  border-radius: var(--radius-pill);
  border-color: color-mix(in srgb, var(--text-muted) 22%, transparent);
  background: var(--bg);
  color: var(--muted);
  box-shadow: var(--shadow-card);
  transition: left var(--motion-fast) var(--ease-standard);
}

.sidebar-edge-toggle:hover {
  border-color: color-mix(in srgb, var(--accent) 28%, transparent);
  background: var(--bg);
  color: var(--text);
}

.shell.sidebar-collapsed .sidebar-edge-toggle {
  display: none;
}

.shell.no-boards .toolbar {
  display: none;
}

.shell.no-boards #sidebar-view-section {
  display: none;
}

.shell.no-boards .sidebar-edge-toggle {
  display: none;
}

@media (min-width: 901px) {
  .shell {
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
  }

  .sidebar {
    min-height: 0;
    max-height: 100vh;
    max-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
  }
}

.sidebar-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.editor-header-actions {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  min-width: fit-content;
}

.board-title-row {
  display: none;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
  flex: 0 0 auto;
}

.shell.sidebar-collapsed .board-title-row {
  display: flex;
}

.collapsed-board-title {
  display: none;
  max-width: 8rem;
  margin: 0;
  overflow: hidden;
  font-size: var(--font-size-section-title);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.shell.sidebar-collapsed .collapsed-board-title {
  display: block;
}

.board-title-row h2 {
  margin: 0;
}

.sidebar-section {
  margin-top: 1.1rem;
  padding-top: 0.9rem;
  border-top: 1px solid color-mix(in srgb, var(--text-muted) 14%, transparent);
}

.sidebar-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.7rem;
}

.sidebar-section-head h3 {
  margin: 0;
  font-size: var(--font-size-section-title);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
}

.sidebar-board-control {
  justify-content: flex-end;
  margin-bottom: 0;
}

.sidebar-toggle {
  width: 100%;
}

.sidebar-toggle button {
  flex: 1 1 0;
}

#sidebar-reopen-button {
  margin-right: 0.1rem;
}

/* Japanese labels fit the same three-way switch without splitting words. */
:lang(ja) .sidebar-toggle button {
  padding-inline: 0.3rem;
  gap: 0.25rem;
  white-space: nowrap;
  font-size: var(--font-size-label);
}

.board-list {
  display: grid;
  gap: 0.5rem;
}

.board-add-button {
  position: relative;
  margin-top: 0.6rem;
  width: var(--control-size-icon);
  min-width: var(--control-size-icon);
  height: var(--control-size-icon);
  justify-content: center;
}

.board-add-button.is-empty-target {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent);
  box-shadow: var(--control-focus-ring);
  animation: board-create-nudge var(--motion-attention) var(--ease-attention)
    infinite;
  margin-bottom: 5.4rem;
}

.board-add-button.is-empty-target::before {
  content: "";
  position: absolute;
  top: calc(100% + 0.18rem);
  left: 0.62rem;
  z-index: 2;
  width: 0.75rem;
  height: 1.05rem;
  background: color-mix(in srgb, var(--accent) 72%, transparent);
  clip-path: polygon(
    50% 0,
    100% 38%,
    65% 38%,
    65% 100%,
    35% 100%,
    35% 38%,
    0 38%
  );
}

.board-add-button.is-empty-target::after {
  content: "Create board here";
  position: absolute;
  top: calc(100% + 1.2rem);
  left: 0;
  z-index: 1;
  width: 13.75rem;
  padding: 0.8rem 0.85rem;
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: var(--radius-surface);
  background: var(--panel-strong);
  color: var(--accent);
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-control);
  text-align: center;
  box-shadow: var(--shadow-card-hover);
}

@keyframes board-create-nudge {
  0%,
  100% {
    box-shadow: var(--attention-ring);
  }

  50% {
    box-shadow: var(--attention-ring-strong);
  }
}

@media (prefers-reduced-motion: reduce) {
  .board-add-button.is-empty-target {
    animation: none;
  }
}

.board-button {
  text-align: left;
  background: transparent;
  cursor: grab;
}

.board-button:active {
  cursor: grabbing;
}

.board-button.dragging-board {
  opacity: 0.45;
}

.board-create-row {
  display: block;
}

.board-create-row input {
  width: 100%;
  min-height: 2.5rem;
  border: 1px solid var(--accent);
  border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  color: var(--text);
  padding: 0.6rem 0.75rem;
  font: inherit;
  outline: none;
}

.board-create-row input:focus {
  box-shadow: var(--control-focus-ring);
}

.board-button.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.sidebar-tag-list {
  display: grid;
  gap: 0.55rem;
}

.sidebar-tag-row {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 0.55rem;
  width: 100%;
  min-width: 0;
}

.sidebar-tag-create-row input {
  width: 100%;
  min-height: 2.2rem;
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);

  background: color-mix(in srgb, var(--surface-2) 72%, transparent);
}

.ticket-status-icon .icon {

  height: var(--icon-size-small);
  stroke-width: 2.4;
}

.ticket-status-icon-resolved {
  border-color: color-mix(in srgb, var(--accent) 24%, transparent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent-soft) 58%, transparent);
}

.ticket-status-icon-archived {
  border-color: var(--border-soft);
  color: var(--text-subtle);
  background: color-mix(in srgb, var(--surface-inset) 82%, transparent);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-width: 0;
  max-width: 100%;
  min-height: 1.35rem;
  border-radius: var(--radius-control);
  border: 1px solid transparent;
  padding: 0.08rem 0.45rem;
  background: var(--accent);
  color: var(--on-accent);
  font-size: var(--font-size-label);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tag-no-color {
  border-color: color-mix(in srgb, var(--text-muted) 38%, transparent);
  background: transparent;
  color: var(--text);
}

.muted {
  color: var(--muted);
}

.markdown {
  overflow-wrap: anywhere;
  color: var(--text);
  line-height: 1.5;
}

.markdown pre {
  max-width: 100%;
  overflow-x: auto;
  margin: 0.75rem 0;
  padding: 0.75rem;
  border: 1px solid color-mix(in srgb, var(--text-muted) 14%, transparent);
  border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--surface-inset) 82%, var(--surface-1));
}

.markdown table {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
  margin: 0.8rem 0;
  border: 1px solid color-mix(in srgb, var(--text-muted) 22%, transparent);
  border-radius: var(--radius-control);
}

.markdown th,
.markdown td {
  padding: 0.42rem 0.6rem;
  border: 1px solid color-mix(in srgb, var(--text-muted) 18%, transparent);
  text-align: left;
  vertical-align: top;
}

.markdown th {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--text);
  font-weight: var(--font-weight-semibold);
}

.markdown tr:nth-child(even) td {
  background: color-mix(in srgb, var(--text-muted) 3%, transparent);
}

.markdown code {
  border-radius: var(--radius-control);
  padding: 0.08rem 0.28rem;
  background: color-mix(in srgb, var(--surface-inset) 75%, var(--surface-1));
  font-size: 0.92em;
}

.markdown pre code {
  display: block;
  padding: 0;
  background: transparent;
  font-size: var(--font-size-body);
  line-height: 1.45;
}

.markdown .hljs-keyword,
.markdown .hljs-selector-tag,
.markdown .hljs-subst {
  color: #7c3aed;
}

.markdown .hljs-string,
.markdown .hljs-regexp,
.markdown .hljs-attr {
  color: #0f766e;
}

.markdown .hljs-title,
.markdown .hljs-name,
.markdown .hljs-section {
  color: #0369a1;
}

.markdown .hljs-number,
.markdown .hljs-literal,
.markdown .hljs-type {
  color: #b45309;
}

.markdown .hljs-comment,
.markdown .hljs-quote {
  color: var(--muted);
  font-style: italic;
}

.markdown > :first-child {
  margin-top: 0;
}

/* Task markers replace bullets, while ordinary Markdown lists keep theirs. */
.markdown li:has(> .task-checkbox) {
  list-style: none;
}

.add-ticket-button {
  flex: 0 0 auto;
  width: calc(100% - 1.5rem);
  height: 2.1rem;
  margin: 0 0.75rem 0.75rem;
  border-color: transparent;
  background: transparent;
  color: var(--text-muted);
  font-size: var(--font-size-body);
}

.add-ticket-button:hover {
  border-color: var(--border-strong);
  background: color-mix(in srgb, var(--accent-soft) 46%, transparent);
  color: var(--accent);
}

.empty-state {
  display: grid;
  justify-items: center;
  gap: var(--space-3);
  max-width: 28rem;
  padding: var(--space-6);
  color: var(--muted);
  text-align: center;
}

.empty-state-icon {
  display: grid;
  place-items: center;
  width: 3rem;
  height: 3rem;
  border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  border-radius: var(--radius-surface);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  color: var(--accent);
}

.empty-state-icon .icon {
  width: var(--icon-size-empty);
  height: var(--icon-size-empty);
}

.empty-state strong {
  color: var(--text);
  font-size: var(--font-size-section-title);
  font-weight: var(--font-weight-semibold);
}

.empty-state p {
  margin: 0;
  line-height: var(--line-height-body);
}

.empty-state-action {

}

.empty-state-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.ux-dialog {
  position: fixed;
  width: min(420px, calc(100vw - var(--space-5) - var(--space-5)));
  margin: 0;
  border: 1px solid color-mix(in srgb, var(--text-muted) 16%, transparent);
  border-radius: var(--radius-surface);
  padding: 0;
  background: var(--panel);
  box-shadow: var(--shadow-dialog);
}

.ux-dialog::backdrop {
  background: var(--overlay-bg);
}

.editor-dialog {
  position: absolute;
  margin: 0;
  width: min(720px, calc(100vw - var(--space-5) - var(--space-5)));
  min-width: min(520px, calc(100vw - var(--space-5) - var(--space-5)));
  min-height: 360px;
  border: 1px solid color-mix(in srgb, var(--text-muted) 16%, transparent);
  border-radius: var(--radius-surface);
  padding: 0;
  background: var(--panel);
  box-shadow: var(--shadow-dialog);
  overflow: visible;
  z-index: 10;
  transition: box-shadow var(--motion-normal) var(--ease-standard);
}

.editor-dialog-resize-handle {
  position: absolute;
  right: 0.2rem;
  bottom: 0.2rem;
  width: 1.1rem;
  height: 1.1rem;
  padding: 0;
  border: none;
  background:
    linear-gradient(135deg, transparent 0 48%, color-mix(in srgb, var(--text-muted) 55%, transparent) 50% 58%, transparent 60%),
    linear-gradient(135deg, transparent 0 68%, color-mix(in srgb, var(--text-muted) 38%, transparent) 70% 78%, transparent 80%);
  cursor: nwse-resize;
}

.editor-dialog-resize-handle:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
  outline-offset: 2px;
}

.ux-form {
  display: grid;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--panel);
  border: none;
  border-radius: var(--radius-surface);
}

.ux-confirm-section-label {
  display: block;
  margin-top: 0.7rem;
  color: var(--text);
  font-weight: var(--font-weight-semibold);
}

.ux-confirm-detail-list {
  display: grid;
  gap: 0.35rem;
  margin: 0.45rem 0 0;
  padding-left: 1.1rem;
}

.ux-confirm-warning {
  display: block;
  margin-top: 0.8rem;
  color: var(--danger);
}

.dialog-close-button {
  color: var(--muted);
  background: transparent;
  border-color: transparent;
  width: 1.8rem;
  min-width: 1.8rem;
  height: 1.8rem;
  font-size: var(--font-size-body);
}

.dialog-close-button:hover {
  background: color-mix(in srgb, var(--text-muted) 8%, transparent);
  border-color: transparent;
  color: var(--text);
}

.dialog-close-button:focus,
.dialog-close-button:focus-visible {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-color: transparent;
  box-shadow: var(--control-focus-ring);
  color: var(--text);
  outline: none;
}

.editor-mode {
  display: grid;

  gap: var(--space-3);
  min-width: 0;
}

.ticket-view {
  display: grid;

  gap: var(--space-3);
  min-width: 0;
}

.comment-form {

}

.editor-header {

}

.editor-header button {

}

.editor-dialog.dragging {

.editor-dialog.resizing {

.editor-actions-right {

.editor-title-row {

.editor-dialog-heading-top {

.ux-fields {

}

}

.ux-color-row {

.tag-manager-list {

}

  width: 2.4rem;

.ticket-tag-field {

.editor-field-label {

  background: color-mix(in srgb, var(--surface-1) 72%, transparent);
}

.editor-readonly-label {
  color: var(--muted);
  font-size: var(--font-size-label);
  font-weight: var(--font-weight-semibold);
}

.editor-readonly-value {
  color: var(--text);
  font-weight: var(--font-weight-semibold);
  overflow-wrap: anywhere;
}

.ticket-remote-body-panel {
  padding: 0.7rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-surface);
  background: color-mix(in srgb, var(--surface-1) 70%, transparent);
}

.editor-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  justify-content: space-between;
  margin-top: 0.15rem;
}

.comments-section {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.75rem;
  min-width: 0;
  min-height: 320px;
  overflow: visible;
  align-content: start;
}

.comment-compose-toggle {
  justify-self: start;
}

.activity-section {
  min-height: 320px;
  overflow: visible;
  align-content: start;
}

.detail-tabs {
  display: flex;
  align-items: flex-end;
  gap: 1rem;
  padding-bottom: 0.2rem;
  border-bottom: 1px solid
    color-mix(in srgb, var(--text-muted) 16%, transparent);
}

.detail-tab {
  padding: 0.2rem 0 0.55rem;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-semibold);
}

.detail-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.detail-tab:hover {
  color: var(--text);
}

.comment-item + .comment-item {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid color-mix(in srgb, var(--text-muted) 20%, transparent);
}

.activity-item + .activity-item {
  margin-top: 0.65rem;
  padding-top: 0.65rem;
  border-top: 1px solid color-mix(in srgb, var(--text-muted) 18%, transparent);
}

.comment-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.35rem;
}

.comment-meta-main {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
  min-width: 0;
}

.activity-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.35rem;
}

.comment-actions {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  min-width: 0;
}

.comment-sync-pill,
.comment-sync-action {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  min-height: 1.35rem;
  padding: 0.12rem 0.42rem;
  border-radius: var(--radius-control);
  font-size: var(--font-size-label);
  font-weight: var(--font-weight-semibold);
}

.comment-sync-pill .icon,
.comment-sync-action .icon {
  width: var(--icon-size-small);
  height: var(--icon-size-small);
}

.comment-sync-pill-pushed {
  background: color-mix(in srgb, var(--success) 12%, transparent);
  color: var(--success);
}

.comment-sync-pill-failed {
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  color: var(--danger);
}

.comment-sync-pill-pushing {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--text);
}

.comment-sync-action {
  border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
}

.comment-sync-error-details {
  flex-basis: 100%;
  margin-top: 0.35rem;
  padding: 0.65rem 0.75rem;
  border: 1px solid color-mix(in srgb, var(--danger) 16%, transparent);
  border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--danger) 5%, transparent);
  color: var(--text);
}

.comment-sync-error-summary {
  color: var(--danger);
  font-size: var(--font-size-label);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-body);
}

.comment-sync-error-raw {
  margin: 0.5rem 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--muted);
  font: inherit;
  font-size: var(--font-size-label);
  line-height: var(--line-height-body);
}

.comment-sync-failed-toggle {
  border: none;
  cursor: pointer;
}

.comment-edit-form {
  display: grid;
  gap: 0.55rem;
}

.comment-edit-form textarea {
  width: 100%;
  resize: vertical;
  border: 1px solid color-mix(in srgb, var(--text-muted) 22%, transparent);
  border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--surface-1) 62%, transparent);
  color: var(--text);
  padding: 0.65rem 0.75rem;
  line-height: var(--line-height-body);
}

.comment-edit-form textarea:focus {
  border-color: var(--control-focus-border);
  box-shadow: var(--control-focus-ring);
  outline: none;
}

.comment-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
}

.comment-delete-confirm {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  color: var(--danger);
  font-size: var(--font-size-label);
  font-weight: var(--font-weight-semibold);
}

.comment-delete-confirm button {
  padding: 0.42rem 0.62rem;
}

.activity-message {
  line-height: var(--line-height-body);
}

.toast {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  max-width: 320px;
  padding: 0.8rem 0.95rem;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
  border-radius: var(--radius-surface);
  background: color-mix(in srgb, var(--accent) 96%, transparent);
  color: var(--on-accent);
  box-shadow: var(--shadow-popover);
  z-index: 40;
}

.toast[data-kind="error"] {
  border-color: color-mix(in srgb, var(--danger) 46%, transparent);
  background: color-mix(in srgb, var(--danger) 96%, transparent);
}

.ticket-ref-resolved {
  text-decoration: line-through;
}

.ticket-ref-inline {
  margin-right: 0.18rem;
}

.list-relation-ticket-link {
  display: inline;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--accent);
  font: inherit;
  line-height: inherit;
  text-decoration: none;
  cursor: pointer;
}

.list-relation-ticket-link:hover {
  text-decoration: underline;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 0.9rem;
  border-top: 1px solid color-mix(in srgb, var(--text-muted) 14%, transparent);
  color: var(--muted);
  font-size: var(--font-size-label);
}

.sidebar-github-link {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  color: inherit;
  text-decoration: none;
}

.github-icon {
  width: 1.25rem;
  height: 1.25rem;
  fill: currentColor;
}

.sidebar-github-link:hover {
  color: var(--text);
  text-decoration: underline;
}

@media (max-width: 900px) {
  .shell,
  .shell.sidebar-collapsed {
    grid-template-columns: minmax(0, 1fr);
  }

  .sidebar {
    width: auto;
    max-width: none;
    border-right: none;
    border-bottom: 1px solid
      color-mix(in srgb, var(--text-muted) 18%, transparent);
    transform: none;
  }

  .shell.sidebar-collapsed .sidebar {
    display: none;
  }

  .toolbar {
    align-items: stretch;
  }

  .toolbar-actions {
    align-items: stretch;
    grid-template-columns: 1fr;
  }

  .toolbar-filters {
    overflow-x: auto;
    flex-wrap: nowrap;
    padding-bottom: 0.1rem;
  }

  .toolbar-filters > * {
    flex-shrink: 0;
  }

  .sidebar-edge-toggle {
    top: 16px;
    right: 16px;
    left: auto;
    transform: none;
  }
}

@media (max-width: 680px) {
  .editor-inline-row {
    grid-template-columns: 1fr;
  }

  .completion-toggle {
    justify-content: flex-start;
  }
}

@media (prefers-color-scheme: dark) {
  button {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .import-button {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .toolbar-search {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .filter-toggle {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .toolbar input {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .toolbar select {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .editor-form input {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .editor-form select {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .editor-form textarea {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .ticket-tag-input {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .markdown .hljs-keyword,
  .markdown .hljs-selector-tag,
  .markdown .hljs-subst {
    color: #c4b5fd;
  }

  .markdown .hljs-string,
  .markdown .hljs-regexp,
  .markdown .hljs-attr {
    color: #5eead4;
  }

  .markdown .hljs-title,
  .markdown .hljs-name,
  .markdown .hljs-section {
    color: #7dd3fc;
  }

  .markdown .hljs-number,
  .markdown .hljs-literal,
  .markdown .hljs-type {
    color: #fbbf24;
  }

  .tag-manager-row input[type="text"] {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  .tag-manager-row input[type="color"] {
    border-color: var(--border-soft);
    background: var(--surface-inset);
    color: var(--text-strong);
  }

  button:hover {
    border-color: var(--border-strong);
    background: var(--surface-2);
  }

  .import-button:hover {
    border-color: var(--border-strong);
    background: var(--surface-2);
  }

  .primary-action {
    border-color: color-mix(in srgb, var(--accent) 74%, transparent);
    background: var(--accent);
    color: var(--on-accent);
  }

  .primary-action:hover {
    border-color: var(--accent-hover);
    background: var(--accent-hover);
    color: var(--on-accent);
  }

  .toolbar .toolbar-search input {
    background: transparent;
  }

  .ticket-tag-search {
    background: transparent;
  }

  .filter-toggle button {
    border-color: var(--border-soft);
    background: transparent;
  }

  .filter-toggle button.active {
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .ghost.active {
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .toolbar-search.is-filter-active,
  .toolbar select.is-filter-active,
  .filter-menu.is-filter-active,
  .filter-toggle.is-filter-active,
  .toolbar-utility-button.is-filter-active {
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .sidebar {
    border-right-color: var(--border-soft);
  }

  .list-board {
    border-color: var(--border-soft);
    background: var(--surface-1);
  }

  .lane {
    border-color: var(--border-soft);
    background: color-mix(in srgb, var(--surface-1) 72%, var(--surface-canvas));
  }

  .lane-header {
    border-bottom-color: var(--border-soft);
    background: color-mix(in srgb, var(--surface-2) 84%, var(--surface-canvas));
    color: var(--text-strong);
  }

  .ticket-card {
    border-color: var(--border-soft);
    background: var(--surface-2);
    color: var(--text-strong);
  }

  .ticket-card:hover {
    border-color: var(--border-strong);
    background: color-mix(in srgb, var(--surface-2) 82%, var(--accent-soft));
  }

  .ticket-link {
    background: transparent;
    color: var(--text-strong);
  }

  .ticket-link:hover {
    background: transparent;
    color: var(--accent-hover);
  }

  .ticket-card.resolved .ticket-link {
    color: var(--text-muted);
  }

  .editor-form {
    border-color: var(--border-soft);
    background: var(--surface-1);
  }

}

/* Group uses the same quiet list, type and action rhythm as Kanban and List. */
.group-board {
  display: grid;
  grid-template-columns: minmax(180px, 230px) minmax(0, 1fr);
  gap: var(--space-6);
  padding: 0;
  align-items: start;
  align-content: start;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}
.group-board[hidden] {
  display: none;
}
.group-list-panel,
.group-content-panel {
  min-width: 0;
}
.group-list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 32px;
  margin-bottom: var(--space-3);
}
.group-list-panel h3,
.group-content-panel h3 {
  margin: 0;
  font-size: var(--font-size-section-title);
  font-weight: var(--font-weight-strong);
  line-height: var(--line-height-control);
}
.group-content-panel {
  container: group-content / inline-size;
  background: var(--surface-1);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-surface);
  padding: var(--space-4);
  min-height: 320px;
}
.group-list-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  margin-bottom: var(--space-3);
}
.group-list-controls .filter-toggle {
  display: inline-flex;
}
.group-choices {
  display: grid;
  gap: var(--space-1);
}
.group-choice {
  width: 100%;
  text-align: left;
  padding: var(--space-2) var(--space-3);
  overflow-wrap: anywhere;
  border-color: transparent;
}
.group-choice:hover {
  border-color: transparent;
  background: var(--surface-inset);
}
.group-choice span,
.group-choice small {
  display: block;
}
.group-choice small {
  margin-top: var(--space-1);
  color: var(--text-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-regular);
}
.group-choice.selected {
  background: var(--accent-soft);
  color: var(--accent);
}
.group-add-button {
  width: 100%;
  height: 32px;
  padding: 0;
  margin-top: var(--space-2);
  border-color: transparent;
  color: var(--text-muted);
}
.group-add-button:hover {
  border-color: var(--border-strong);
  background: color-mix(in srgb, var(--accent-soft) 46%, transparent);
  color: var(--accent);
}
.group-name {
  font: inherit;
  text-align: left;
  padding: var(--space-1) 0;
  border-color: transparent;
  overflow-wrap: anywhere;
}
.group-name:hover {
  border-color: transparent;
  color: var(--accent);
}
.group-description {
  margin-top: var(--space-2);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-soft);
}
.group-description-summary {
  line-height: 1.5;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.group-description-body :is(h1, h2, h3, h4, h5, h6),
.group-description-preview :is(h1, h2, h3, h4, h5, h6) {
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-semibold);
  line-height: 1.5;
  margin: var(--space-4) 0 var(--space-2);
}
.group-description-body > :first-child,
.group-description-preview > :first-child {
  margin-top: 0;
}
.group-description-body > :last-child {
  margin-bottom: 0;
}
.group-description-body img,
.group-description-preview img {
  max-width: 100%;
  height: auto;
}
.group-description-actions,
.group-actions,
.group-ticket-toolbar {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  flex-wrap: wrap;
}
.group-description-actions {
  justify-content: space-between;
  margin-top: var(--space-1);
}
.group-text-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  min-height: 32px;
  padding: var(--space-1) var(--space-2);
  border-color: transparent;
  color: var(--text-muted);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}
.group-text-action:hover {
  border-color: transparent;
  background: var(--surface-inset);
  color: var(--accent);
}
.group-description-actions .group-text-action,
.group-description-add,
.group-archive-toggle {
  padding-left: 0;
  padding-right: 0;
}
.group-description-add {
  margin-top: var(--space-1);
}
.group-ticket-toolbar {
  justify-content: flex-start;
  min-height: 32px;
  margin: var(--space-4) 0 var(--space-2);
  gap: var(--space-2);
}
.group-ticket-count {
  font-size: var(--font-size-meta);
  white-space: nowrap;
}
.group-ticket-family {
  margin-bottom: var(--space-3);
}
.group-ticket-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--group-lane-width, 96px) 32px;
  gap: var(--space-2);
  align-items: center;
  border-bottom: 1px solid var(--border-soft);
  padding: var(--space-2) 0;
  min-height: 52px;
}
.group-ticket-title-cell {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}
.group-ticket-title-cell > .ticket-hierarchy-icon {
  flex: 0 0 auto;
}
.group-ticket-title {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.group-ticket-title.list-ticket-link {
  align-items: baseline;
  overflow: visible;
  padding: var(--space-1) 0;
  min-height: 32px;
}
.group-ticket-title .ticket-ref {
  flex: 0 0 auto;
  color: var(--text-subtle);
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
}
.group-ticket-meta {
  grid-column: 2;
  min-width: 0;
  font-size: var(--font-size-meta);
  color: var(--text-muted);
  overflow-wrap: anywhere;
}
.group-remove-button {
  grid-column: 3;
  padding: 0;
  justify-self: end;
  white-space: nowrap;
}
.group-ticket-context {
  color: var(--text-muted);
}
.group-ticket-child {
  border-left: 1px solid var(--border-soft);
  margin-left: var(--space-2);
  padding-left: var(--space-3);
}

.group-archive-toggle {
  color: var(--accent);
  margin-top: var(--space-2);
}
.group-empty {
  padding: var(--space-4) 0;
}
.group-delete {
  display: block;
  margin-top: var(--space-5);
}
.group-edit-form {
  display: grid;
  gap: var(--space-3);
  margin: var(--space-3) 0;
}
.group-edit-form label,
.group-edit-form textarea,
.group-edit-form input {
  width: 100%;
  min-width: 0;
}
.group-edit-form label {
  display: grid;
  gap: var(--space-1);
}
.group-edit-form textarea {
  resize: vertical;
  line-height: 1.5;
}
.group-selection {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.group-selection:empty,
.group-ticket-options:empty {
  display: none;
}
.group-selected-ticket {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  border-radius: var(--radius-control);
  background: var(--accent-soft);
  padding-left: var(--space-2);
  overflow-wrap: anywhere;
}
.group-ticket-options {
  display: grid;
}
.group-ticket-options button {
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--border-soft);
  border-radius: 0;
}
.group-ticket-options button[aria-selected="true"] {
  background: var(--accent-soft);
}
.group-ticket-options small {
  display: block;
  color: var(--text-muted);
}
.group-error {
  color: var(--danger);
}
.group-error:empty {
  display: none;
}
.group-impact-list {
  padding-left: var(--space-5);
  overflow-wrap: anywhere;
}
.group-conflict-choice {
  width: 100%;
  text-align: left;
  margin: var(--space-2) 0;
}
.group-conflict-choice small {
  display: block;
  color: var(--text-muted);
  margin-top: var(--space-1);
}
.ticket-group-meta a {
  color: var(--accent);
  overflow-wrap: anywhere;
}
.editor-group-context {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--font-size-meta);
  grid-column: 1 / -1;
}
.shell.view-group .toolbar-actions {
  display: none;
}
/* Keep the shared toolbar footprint while Group has no ticket filters. */
.group-view-label {
  display: none;
}
.shell.view-group .toolbar {
  display: flex;
}
.shell.view-group .board-title-row {
  display: flex;
  min-height: 2.45rem;
  max-width: 100%;
}
.shell.view-group .collapsed-board-title {
  display: block;
  max-width: none;
  flex: 0 1 auto;
}
.shell.view-group .group-view-label {
  display: block;
  flex-shrink: 0;
  color: var(--text-muted);
  font-size: var(--font-size-meta);
}
.shell.view-group .board-title-row .icon-button {
  flex-shrink: 0;
}
.group-edit-form input,
.group-edit-form textarea {
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);
  background: var(--control-bg);
  color: var(--text);
  font: inherit;
  padding: var(--space-2) var(--space-3);
}
.group-edit-form input:focus,
.group-edit-form textarea:focus {
  border-color: var(--control-focus-border);
  box-shadow: var(--control-focus-ring);
  outline: none;
}
.group-board button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.group-board button:disabled {
  opacity: 0.5;
  cursor: default;
}
@media (max-width: 720px) {
  .group-board {
    grid-template-columns: minmax(0, 1fr);
  }
}
@container group-content (max-width: 440px) {
  .group-ticket-row {
    --group-lane-width: 72px;
  }
}

.group-sort-buttons {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}
.group-sort-button .list-sort-indicator {
  width: 12px;
  height: 12px;
}

.group-detail-heading {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  min-height: 32px;
}
.group-detail-heading h3 {
  min-width: 0;
}
.group-detail-heading .group-ticket-count {
  flex-shrink: 0;
}
.group-remove-button:hover {
  color: var(--danger);
}
@media (max-width: 900px) {
  .shell.view-group.sidebar-collapsed {
    grid-template-columns: minmax(0, 1fr);
  }
}

.group-sort-button {
  min-height: 32px;
  font-size: var(--font-size-meta);
  font-weight: var(--font-weight-medium);
  color: var(--text-muted);
  width: auto;
  height: var(--control-size-icon);
  min-width: var(--control-size-icon);
  padding: 0 var(--space-2);
  gap: var(--space-1);
  justify-content: center;
  border-radius: var(--radius-control);
}
.group-sort-button .icon {
  width: var(--icon-size-default);
  height: var(--icon-size-default);
}
.group-sort-button.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.group-sort-button:hover {
  background: var(--surface-inset);
  color: var(--accent);
}

.group-sort-button .list-sort-indicator .icon {
  width: 12px;
  height: 12px;
}

/* Context-only archived parents use the same metrics as ordinary ticket links. */
.group-ticket-context .group-ticket-title {
  color: var(--text-muted);
}

.group-ticket-toolbar > .group-text-action {
  border-color: var(--line);
}
.group-ticket-toolbar > .group-text-action:hover {
  border-color: var(--accent);
}

:lang(ja) .group-list-controls { column-gap: var(--space-2); }
:lang(ja) .group-list-controls .filter-toggle button {
  min-width: 0;
  padding-inline: var(--space-1);
  font-size: var(--font-size-label);
  white-space: nowrap;
}

/* Reserve independent status slots even when one or both icons are absent. */
.group-ticket-status {
  display: grid;
  grid-template-columns: repeat(2, 1.25rem);
  gap: 0.25rem;
  width: 2.75rem;
  flex: 0 0 2.75rem;
}
.group-ticket-status .ticket-status-icon {
  grid-row: 1;
}
.group-ticket-status .ticket-status-icon-resolved {
  grid-column: 1;
}
.group-ticket-status .ticket-status-icon-archived {
  grid-column: 2;
}
.group-ticket-resolved .group-ticket-title,
.group-ticket-archived .group-ticket-title {
  color: var(--text-muted);
  font-weight: var(--font-weight-regular);
}

 const d=document.createElement('dialog');d.className='editor-dialog mock-dialog';d.setAttribute('aria-label',t('新しいチケット','New ticket'));d.innerHTML=`<div class="editor-form"><div class="editor-header"><h2 class="mock-editor-title">${t('新しいチケット','New ticket')}</h2><button type="button" class="ghost dialog-close-button" data-close aria-label="${t('閉じる','Close')}">×</button></div><form class="editor-mode"><div class="mock-context"><span>${t('開発ボード','Development board')}</span>${group?`<span>／ ${esc(group)}</span>`:''}</div><input id="mock-title" required aria-label="${t('タイトル','Title')}" placeholder="${t('タイトル','Title')}" autocomplete="off"><textarea id="mock-body" aria-label="${t('本文','Body')}" placeholder="${t('Markdownで詳細を記入','Write details in Markdown')}"></textarea><div class="editor-inline-row"><label class="editor-compact-label"><span>${t('レーン','Lane')}</span><select id="mock-lane">${['todo','doing','Acceptance','done'].map(l=>`<option ${l===cleanLane?'selected':''}>${l}</option>`).join('')}</select></label><label class="editor-compact-label"><span>${t('優先度','Priority')}</span><select><option>${t('中','Medium')}</option><option>${t('高','High')}</option><option>${t('低','Low')}</option><option>${t('緊急','Urgent')}</option></select></label></div><p id="mock-completion" class="mock-notice"></p><label>${t('タグ','Tags')}<input disabled placeholder="${t('このモックでは対象外','Not included in this mock')}"></label><div class="editor-actions"><span class="mock-save-hint"><kbd>⌘ / Ctrl</kbd> + <kbd>Enter</kbd> ${t('保存','Save')}</span><div class="editor-actions-right"><button type="button" class="ghost" data-close>${t('キャンセル','Cancel')}</button><button id="mock-save" type="submit" class="primary-action">${t('保存','Save')}</button></div></div></form></div>`;
 document.body.append(d);const title=d.querySelector('#mock-title'),body=d.querySelector('#mock-body'),laneSelect=d.querySelector('#mock-lane');const notice=()=>{d.querySelector('#mock-completion').textContent=laneSelect.value==='done'?t('完了したチケットとして作成します。','This ticket will be created as completed.'):''};laneSelect.onchange=notice;notice();
 function finish(){d.close();d.remove();for(const[e,y,x]of scrolls){e.scrollTop=y;e.scrollLeft=x}origin?.focus({preventScroll:true})}
 function cancel(){if(busy)return;if(!title.value&&!body.value){finish();return}const c=document.createElement('dialog');c.className='mock-confirm';c.setAttribute('aria-label',t('未保存の変更','Unsaved changes'));c.innerHTML=`<p>${t('入力した内容を破棄しますか？','Discard your changes?')}</p><div><button data-keep>${t('入力を続ける','Keep editing')}</button><button data-discard>${t('破棄する','Discard')}</button></div>`;document.body.append(c);c.showModal();c.querySelector('[data-keep]').focus();const keep=()=>{c.close();c.remove();title.focus()};c.oncancel=e=>{e.preventDefault();keep()};c.querySelector('[data-keep]').onclick=keep;c.querySelector('[data-discard]').onclick=()=>{c.close();c.remove();finish()};}
 d.querySelectorAll('[data-close]').forEach(b=>b.onclick=cancel);d.oncancel=e=>{e.preventDefault();cancel()};d.querySelector('form').onsubmit=e=>{e.preventDefault();save()};
 async function save(){if(busy||composing||!title.value.trim())return;busy=true;d.querySelector('#mock-save').disabled=true;await new Promise(r=>setTimeout(r,180));const item={id:serial++,title:title.value.trim(),lane:laneSelect.value,group,view};saved.push(item);renderCreated(item);busy=false;finish();document.querySelector('.mock-status')?.remove();const n=document.createElement('div');n.className='mock-status';n.setAttribute('role','status');n.textContent=t(`モックで #${item.id} を ${item.lane} に作成。元の位置に戻りました。`,`Mock #${item.id} created in ${item.lane}. Returned to your starting point.`);document.body.append(n);setTimeout(()=>n.remove(),6000)}
 d.addEventListener('compositionstart',()=>composing=true);d.addEventListener('compositionend',()=>composing=false);d.addEventListener('keydown',e=>{if(e.isComposing||composing||e.keyCode===229)return;if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();if(!e.repeat)save()}else if(e.key==='Enter'&&e.target===title)e.preventDefault()});d.showModal();title.focus();
}
 document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229||e.repeat||e.metaKey||e.ctrlKey||e.altKey||document.querySelector('dialog[open]'))return;const el=document.activeElement;if(e.key.toLowerCase()==='n'&&el?.matches('.ticket-link,.list-ticket-link,.add-ticket-button,[data-group-action="new-ticket"],[data-select-group]')){e.preventDefault();open(el)}});
 window.mockResults=()=>saved.map(x=>({...x}));render();
})();
