name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next version without v (for example 1.2.0, or 1.2.0-rc.1 for a prerelease trial)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create optional scoped App token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Prepare version and reviewable release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs
      - name: Open preparation PR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/release-$RELEASE_VERSION"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json docs/openapi.yaml README.md README.ja.md docs/en/user-guide.md docs/ja/user-guide.md "docs/releases/v$RELEASE_VERSION.md"
          git commit -m "Prepare release v$RELEASE_VERSION"
          git push origin "$branch"
          cat > /tmp/release-pr-body.md <<'BODY'
          Prepare the version and consumer installation examples for this release.

          Review and complete both Japanese and English release notes, including breaking changes, migration instructions and limitations. Remove the draft marker only after that review. CI must pass before merging.

          Follow the team rules in docs/en/developer/release.md. After merging, run a Release dry-run on main with this version and the full merged commit SHA. Verify the candidate locally in isolation. Once approved, publish using the same version, SHA and candidate artifact ID. Record the following here before publication:

          - Release owner and target SHA:
          - Dry-run URL, candidate artifact ID and image IDs:
          - Local candidate verification: steps, results and limitations:
          - Upgrade, backup and restoration verification, or reason not applicable:
          - Publication decision:

          After publication, add the Release URL and verification of the published image. A merge does not authorize publication or an update to an existing runtime.

          If this PR was created with GITHUB_TOKEN, approve its pending CI workflow runs on GitHub. A configured RELEASE_APP_ID avoids that additional workflow approval.
          BODY
          gh pr create --base main --head "$branch" --title "Release v$RELEASE_VERSION" --body-file /tmp/release-pr-body.md
