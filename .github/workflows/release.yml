name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version without v
        required: true
        type: string
      sha:
        description: Full 40-character commit SHA on main
        required: true
        type: string
      publish:
        description: Publish the validated image and GitHub Release (false is dry-run)
        required: true
        default: false
        type: boolean
      candidate_artifact_id:
        description: Artifact ID from a successful dry-run (required only for publish)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch inputs before checking out target code
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ "$RELEASE_PUBLISH" == "true" ]]; then
            if [[ ! "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Publish requires the candidate_artifact_id from the accepted dry-run"
              exit 1
            fi
          elif [[ -n "$CANDIDATE_ARTIFACT_ID" ]]; then
            echo "::error::Leave candidate_artifact_id empty for a dry-run"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Enforce trusted main ancestry before running target scripts
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
      - name: Validate release inputs, target and notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/release-verify.mjs

  verify:
    if: '!inputs.publish'
    needs: preflight
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.sha }}

  image:
    if: '!inputs.publish'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: kanbalone:release-check
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify existing-data upgrades and restoration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/verify-upgrade-restore.mjs kanbalone:release-check
      - name: Retain upgrade and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-restore-${{ github.run_attempt }}
          path: coverage/upgrade-restore/
          retention-days: 30
          if-no-files-found: warn
      - name: Smoke test and save exact image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/package-release-image.mjs kanbalone:release-check
      - name: Upload verified release candidate
        id: candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: release-artifact/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Record candidate artifact ID
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
        run: |
          {
            echo "### Verified release candidate"
            echo "Artifact ID: [$CANDIDATE_ARTIFACT_ID]($CANDIDATE_ARTIFACT_URL)"
            echo "Use this ID as candidate_artifact_id after the entire dry-run succeeds and you accept the candidate."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out publication tooling from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          path: release-target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact
          RELEASE_PUBLISH: 'true'
        working-directory: release-target
        run: node ../scripts/release-publish.mjs
      - name: Retain publication record even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            release-artifact/manifest.json
            release-artifact/published-manifest.json
          retention-days: 30
          if-no-files-found: warn
