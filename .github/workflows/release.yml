name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version without v
        required: true
        type: string
      sha:
        description: Full 40-character commit SHA on main
        required: true
        type: string
      publish:
        description: Publish the validated image and GitHub Release (false is dry-run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SHA before checking out target code
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Enforce trusted main ancestry before running target scripts
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
      - name: Validate release inputs, target and notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/release-verify.mjs

  verify:
    needs: preflight
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.sha }}

  image:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build once for test and publication
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: kanbalone:release-check
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify existing-data upgrades and restoration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/verify-upgrade-restore.mjs kanbalone:release-check
      - name: Retain upgrade and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-restore-${{ github.run_attempt }}
          path: coverage/upgrade-restore/
          retention-days: 30
          if-no-files-found: warn
      - name: Smoke test and save exact image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/package-release-image.mjs kanbalone:release-check
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ inputs.version }}
          path: release-artifact/
          compression-level: 0
          overwrite: true
          retention-days: 30
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [preflight, verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-image-${{ inputs.version }}
          path: release-artifact/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_PUBLISH: 'true'
        run: node scripts/release-publish.mjs
      - name: Retain publication record even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            release-artifact/manifest.json
            release-artifact/published-manifest.json
          retention-days: 30
          if-no-files-found: warn
