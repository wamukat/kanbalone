name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}

  docker:
    name: Docker persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
      - id: package
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: kanbalone:release-check
          labels: |
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime and persistence
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/smoke-image.mjs kanbalone:release-check

  required:
    name: Required checks
    if: always()
    needs: [verify, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: test "$VERIFY_RESULT" = success && test "$DOCKER_RESULT" = success
